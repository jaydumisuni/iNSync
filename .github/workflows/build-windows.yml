name: Build iNSync Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "backend/**"
      - "techguy-build.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout iNSync
        uses: actions/checkout@v4

      - name: Checkout THETECHGUY Builder
        uses: actions/checkout@v4
        with:
          repository: jaydumisuni/thetechguy-software-builder
          ref: fix/linux-electron-runtime-permissions-20260925
          path: _builder

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Builder CLI
        shell: pwsh
        run: python -m pip install -e ./_builder

      - name: Builder doctor
        shell: pwsh
        run: ttg-builder doctor --json

      - name: Build Windows EXE
        shell: pwsh
        run: ttg-builder build . --target windows-exe --install-dependencies --json

      - name: Prove artifact
        id: prove
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -Path dist/electron -Filter *.exe -File | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $artifact) { throw "Windows EXE artifact not found" }
          $hash = (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash.ToLowerInvariant()
          "ARTIFACT=$($artifact.FullName)"
          "SHA256=$hash"
          "SIZE=$($artifact.Length)"
          "artifact=$($artifact.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: iNSync-windows-x64
          path: ${{ steps.prove.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14
