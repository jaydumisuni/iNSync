<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{--red:#ff5d7b;--blue:#59ccff;--green:#42f79d;--text:#edf9ff;--muted:#a9bfd6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Inter,Arial,sans-serif;color:var(--text)}
button,select,input{-webkit-app-region:no-drag;font:inherit}
#shell{width:100%;height:100%;padding:8px 0 8px 8px;-webkit-app-region:no-drag;pointer-events:auto}
#card{-webkit-app-region:no-drag;height:100%;border-radius:22px 0 0 22px;border:1px solid rgba(91,189,255,.2);border-right:0;background:linear-gradient(180deg,rgba(17,27,49,.92),rgba(6,12,25,.91));backdrop-filter:blur(22px);box-shadow:0 18px 45px rgba(0,0,0,.45);padding:10px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:7px;opacity:.18;transform:translateX(181px);transition:opacity .18s ease,transform .18s ease}
#shell:hover #card,#card.expanded,#card:focus-within{opacity:1;transform:translateX(0)}
.top{-webkit-app-region:drag;cursor:move;display:flex;align-items:center;justify-content:space-between;gap:10px}.top b{font-size:12px}.dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 14px currentColor}.dot.disconnected{color:var(--red);background:var(--red)}.dot.receiving{color:var(--blue);background:var(--blue)}.dot.sending{color:var(--green);background:var(--green)}
select{width:100%;padding:7px;border-radius:11px;border:1px solid rgba(91,184,255,.14);background:#0b1426;color:#fff;outline:none;font-size:10px}
.pane{display:grid;gap:6px;align-content:start;min-height:0}.pane[hidden]{display:none}
.status{padding:7px;border-radius:11px;border:1px solid rgba(88,181,255,.09);background:rgba(255,255,255,.025);font-size:9px;color:#d7ebff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}.quick button,.wide{padding:7px 6px;border-radius:10px;border:1px solid rgba(90,184,255,.12);background:rgba(255,255,255,.04);color:#edf9ff;font-size:8.5px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(90deg,rgba(37,220,255,.18),rgba(89,104,255,.22))}
.targets{display:grid;gap:4px;font-size:8.5px;color:#cfe3f6}.targets label{display:flex;align-items:center;gap:5px}.targets input{accent-color:#25d7ff}
.job{display:none;gap:4px}.job.show{display:grid}.jobline{display:flex;justify-content:space-between;gap:6px;font-size:8px;color:#d9edff}.bar{height:5px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#24dfff,#5c72ff)}
#openMain{padding:7px;border-radius:10px;border:1px solid rgba(90,184,255,.13);background:linear-gradient(90deg,rgba(37,220,255,.16),rgba(89,104,255,.2));color:#eef9ff;font-size:9px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="shell"><div id="card">
  <div class="top"><b id="title">Connection</b><span id="dot" class="dot disconnected"></span></div>
  <select id="mode"><option value="connection">Connection</option><option value="clipboard">Clipboard</option></select>
  <div class="pane" data-pane="connection">
    <div id="connectionText" class="status">Disconnected</div>
    <div class="quick"><button id="refreshSharing">Refresh</button><button id="toggleSharing" class="primary">Start sharing</button></div>
  </div>
  <div class="pane" data-pane="clipboard" hidden>
    <div id="peerText" class="status">No approved peers</div>
    <div class="quick"><button id="clipText">Paste text</button><button id="clipImage">Send image</button></div>
    <button id="refreshPeers" class="wide">Refresh peers</button>
  </div>
  <div id="job" class="job"><div class="jobline"><span id="jobText">Working</span><span id="jobPct">0%</span></div><div class="bar"><i id="jobBar"></i></div></div>
  <button id="openMain">Open iNSync</button>
</div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let state={mode:"connection",connection:"disconnected",clipboardEnabled:true};
let activeJob="";
let peers=[];
let collapseTimer=0;
const shell=$("#shell"),card=$("#card");
function expandWidget(){
  clearTimeout(collapseTimer);
  card.classList.add("expanded");
}
function scheduleCollapse(){
  clearTimeout(collapseTimer);
  collapseTimer=setTimeout(()=>{
    const focused=card.contains(document.activeElement);
    if(!card.matches(":hover")&&!focused)card.classList.remove("expanded");
  },1200);
}
shell.addEventListener("pointerenter",expandWidget);
shell.addEventListener("pointerleave",scheduleCollapse);
card.addEventListener("pointerdown",expandWidget);
card.addEventListener("focusin",expandWidget);
card.addEventListener("focusout",scheduleCollapse);
function apply(s){
  state={...state,...s};
  $("#mode").value=state.mode;
  $("#title").textContent=state.mode==="clipboard"?"Clipboard":"Connection";
  $$(".pane").forEach(p=>p.hidden=p.dataset.pane!==state.mode);
  $("#dot").className="dot "+state.connection;
  $("#connectionText").textContent=state.connection==="sending"?"Sharing Internet":state.connection==="receiving"?"Receiving":"Disconnected";
  $("#toggleSharing").textContent=state.connection==="sending"?"Back to normal":"Start sharing";
}
function showJob(job){
  activeJob=job?.id||"";
  if(!job){$("#job").classList.remove("show");return}
  $("#job").classList.add("show");$("#jobText").textContent=job.message||job.operation;$("#jobPct").textContent=Math.round(job.progress||0)+"%";$("#jobBar").style.width=(job.progress||0)+"%";
}
async function submit(op,params={}){
  try{const r=await window.ttg.backend.submit(op,params);if(r?.job)showJob(r.job)}catch{}
}
async function refreshPeers(){
  const r=await window.ttg.backend.submit("peer.list",{});
  if(r?.job)showJob(r.job);
}
$("#mode").onchange=e=>{expandWidget();window.ttg.stateSet({mode:e.target.value})};
$("#refreshSharing").onclick=()=>{expandWidget();submit("sharing.status",{})};
$("#toggleSharing").onclick=()=>{expandWidget();submit("sharing.toggle",{enable:state.connection!=="sending",public:"Wi-Fi",private:"Ethernet"})};
$("#refreshPeers").onclick=()=>{expandWidget();refreshPeers()};
$("#clipText").onclick=async()=>{expandWidget();const c=await window.ttg.clipboard.readText();submit("clipboard.text",{text:c.text,targets:peers.map(x=>x.id).filter(Boolean)})};
$("#clipImage").onclick=async()=>{expandWidget();const c=await window.ttg.clipboard.readImage();submit("clipboard.image",{data_url:c.dataUrl,targets:peers.map(x=>x.id).filter(Boolean)})};
$("#openMain").onclick=()=>window.ttg.showMain();
window.ttg.onBackendEvent(evt=>{
  const job=evt?.job;
  if((evt?.type==="job.progress"||evt?.type==="job.queued")&&job&&job.id===activeJob)showJob(job);
  if(evt?.type==="job.finished"&&job&&job.id===activeJob){
    showJob(job);
    if(job.operation==="peer.list"){peers=(job.result?.peers||[]).filter(x=>!x.self&&x.approved!==false);$("#peerText").textContent=peers.length?peers.map(x=>x.name||x.host||x.id).join(", "):"No approved peers";}
    if(job.operation==="sharing.status"||job.operation==="sharing.toggle"){const s=job.result?.status||job.result;if(s?.connection)apply({connection:s.connection});}
  }
  if(evt?.type==="peer.clipboard"){$("#peerText").textContent="Received from "+(evt.sender_name||evt.sender_ip||"peer");}
});
(async()=>{try{const s=await window.ttg.stateGet();if(s)apply(s)}catch{};window.ttg.onState(apply);apply(state)})();
</script>
</body>
</html>
