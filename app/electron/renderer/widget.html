<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{--red:#ff5d7b;--blue:#59ccff;--green:#42f79d;--text:#edf9ff;--muted:#9fb5cb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Inter,Arial,sans-serif;color:var(--text)}
button,input{-webkit-app-region:no-drag;font:inherit}
#shell{width:100%;height:100%;padding:8px 0 8px 8px;-webkit-app-region:no-drag;pointer-events:auto}
#card{-webkit-app-region:no-drag;height:100%;border-radius:22px;border:1px solid rgba(91,189,255,.22);background:radial-gradient(circle at 78% -8%,rgba(255,178,53,.28),transparent 38%),linear-gradient(180deg,rgba(17,27,49,.95),rgba(6,12,25,.95));backdrop-filter:blur(22px);box-shadow:0 18px 45px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.025);padding:11px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;opacity:.16;transform:translateX(181px);transition:opacity .18s ease,transform .18s ease}
#shell:hover #card,#card.expanded,#card:focus-within{opacity:1;transform:translateX(0)}
.top{-webkit-app-region:drag;cursor:move;display:flex;align-items:center;justify-content:flex-start;gap:8px;padding:0 2px}.title-link{-webkit-app-region:no-drag;border:0;background:transparent;padding:0;color:#d4e6f6;cursor:pointer;text-align:left}.eyebrow{font-size:10px;letter-spacing:.13em;color:#d4e6f6;font-weight:650}.title-link:hover{color:#fff}
.combo{position:relative}.combo-trigger{width:100%;min-height:31px;border:1px solid rgba(80,160,220,.18);border-radius:11px;background:rgba(8,14,27,.8);color:#e9f6ff;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;padding:7px 9px;cursor:pointer;font-size:9px}.chev{width:8px;height:8px;border-right:2px solid #c3d7e8;border-bottom:2px solid #c3d7e8;transform:rotate(45deg) translateY(-2px)}.combo.open .chev{transform:rotate(225deg) translate(-1px,-1px)}.combo-list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 5px);padding:5px;border:1px solid rgba(91,119,191,.35);border-radius:11px;background:rgba(8,13,21,.99);box-shadow:0 18px 50px rgba(0,0,0,.5)}.combo-list[hidden]{display:none}.combo-option{width:100%;border:0;border-radius:8px;padding:8px 9px;background:transparent;color:#dce7f5;text-align:left;font-size:9px;font-weight:700;cursor:pointer}.combo-option:hover,.combo-option.active{background:linear-gradient(90deg,rgba(87,165,255,.18),rgba(124,109,255,.12));color:#fff}
.pane{min-height:0}.pane[hidden]{display:none}
.states{display:grid;gap:7px;align-content:center;height:100%}.state-pill{height:42px;border-radius:22px;border:1px solid rgba(97,136,188,.16);background:linear-gradient(180deg,rgba(25,37,64,.72),rgba(12,20,39,.72));color:#93a1b4;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.025);backdrop-filter:blur(12px)}.state-pill.disconnected.active{color:#ffe0e6;border-color:rgba(255,93,123,.34);background:linear-gradient(100deg,rgba(89,28,47,.75),rgba(34,22,42,.86));box-shadow:0 0 22px rgba(255,93,123,.15),inset 0 0 18px rgba(255,93,123,.08)}.state-pill.receiving.active{color:#69d8ff;border-color:rgba(89,204,255,.46);background:linear-gradient(100deg,rgba(30,59,139,.86),rgba(93,172,222,.6));box-shadow:0 0 24px rgba(89,204,255,.2),inset 0 0 18px rgba(89,204,255,.12)}.state-pill.sending.active{color:#baffd3;border-color:rgba(66,247,157,.4);background:linear-gradient(100deg,rgba(18,91,62,.76),rgba(32,67,72,.78));box-shadow:0 0 24px rgba(66,247,157,.18),inset 0 0 18px rgba(66,247,157,.1)}
.clipboard{display:grid;gap:7px;align-content:start}.status{padding:8px;border-radius:12px;border:1px solid rgba(88,181,255,.09);background:rgba(255,255,255,.025);font-size:9px;color:#d7ebff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}.quick button,.wide{padding:7px 6px;border-radius:10px;border:1px solid rgba(90,184,255,.12);background:rgba(255,255,255,.04);color:#edf9ff;font-size:8.5px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(90deg,rgba(37,220,255,.18),rgba(89,104,255,.22))}
.job{display:none;gap:4px}.job.show{display:grid}.jobline{display:flex;justify-content:space-between;gap:6px;font-size:8px;color:#d9edff}.bar{height:5px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#24dfff,#5c72ff)}
</style>
</head>
<body>
<div id="shell"><div id="card">
  <div class="top"><button id="openMain" class="title-link"><span id="title" class="eyebrow">CONNECTION</span></button></div>
  <div id="modeCombo" class="combo">
    <button class="combo-trigger" type="button"><span id="modeLabel">Connection</span><span class="chev"></span></button>
    <div class="combo-list" hidden>
      <button class="combo-option active" data-mode="connection">Connection</button>
      <button class="combo-option" data-mode="clipboard">Clipboard</button>
    </div>
  </div>
  <div class="pane states" data-pane="connection">
    <button class="state-pill disconnected" data-state="disconnected">Disconnected</button>
    <button class="state-pill receiving" data-state="receiving">Receiving</button>
    <button class="state-pill sending" data-state="sending">Sending</button>
  </div>
  <div class="pane clipboard" data-pane="clipboard" hidden>
    <div id="peerText" class="status">No approved peers</div>
    <div class="quick"><button id="clipText">Paste text</button><button id="clipImage">Send image</button></div>
    <button id="refreshPeers" class="wide">Refresh peers</button>
  </div>
  <div id="job" class="job"><div class="jobline"><span id="jobText">Working</span><span id="jobPct">0%</span></div><div class="bar"><i id="jobBar"></i></div></div>
</div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let state={mode:"connection",connection:"disconnected",clipboardEnabled:true};
let activeJob="",peers=[],collapseTimer=0;
const shell=$("#shell"),card=$("#card"),combo=$("#modeCombo"),comboList=combo.querySelector(".combo-list");
function expandWidget(){clearTimeout(collapseTimer);card.classList.add("expanded")}
function scheduleCollapse(){clearTimeout(collapseTimer);collapseTimer=setTimeout(()=>{const focused=card.contains(document.activeElement);if(!card.matches(":hover")&&!focused)card.classList.remove("expanded")},1200)}
shell.addEventListener("pointerenter",expandWidget);shell.addEventListener("pointerleave",scheduleCollapse);card.addEventListener("pointerdown",expandWidget);card.addEventListener("focusin",expandWidget);card.addEventListener("focusout",scheduleCollapse);
function apply(s){
  state={...state,...s};
  const mode=state.mode==="clipboard"?"clipboard":"connection";
  $("#title").textContent=mode==="clipboard"?"CLIPBOARD":"CONNECTION";
  $("#modeLabel").textContent=mode==="clipboard"?"Clipboard":"Connection";
  $$(".combo-option").forEach(x=>x.classList.toggle("active",x.dataset.mode===mode));
  $$(".pane").forEach(p=>p.hidden=p.dataset.pane!==mode);
  $$(".state-pill").forEach(x=>x.classList.toggle("active",x.dataset.state===state.connection));
}
function showJob(job){
  activeJob=job?.id||"";
  if(!job){$("#job").classList.remove("show");return}
  $("#job").classList.add("show");$("#jobText").textContent=job.message||job.operation;$("#jobPct").textContent=Math.round(job.progress||0)+"%";$("#jobBar").style.width=(job.progress||0)+"%";
}
async function submit(op,params={}){try{const r=await window.ttg.backend.submit(op,params);if(r?.job)showJob(r.job)}catch{}}
async function refreshPeers(){const r=await window.ttg.backend.submit("peer.list",{});if(r?.job)showJob(r.job)}
combo.querySelector(".combo-trigger").onclick=e=>{e.stopPropagation();expandWidget();comboList.hidden=!comboList.hidden;combo.classList.toggle("open",!comboList.hidden)};
$$(".combo-option").forEach(x=>x.onclick=async()=>{comboList.hidden=true;combo.classList.remove("open");await window.ttg.stateSet({mode:x.dataset.mode});apply({mode:x.dataset.mode})});
document.addEventListener("click",e=>{if(!e.target.closest("#modeCombo")){comboList.hidden=true;combo.classList.remove("open")}});
$$(".state-pill").forEach(x=>x.onclick=()=>{expandWidget();const target=x.dataset.state;if(target==="sending")submit("sharing.toggle",{enable:true,public:"Wi-Fi",private:"Ethernet"});else if(target==="disconnected")submit("sharing.toggle",{enable:false,public:"Wi-Fi",private:"Ethernet"});else submit("peer.configure",{role:"receiver",scope:"internet-only",shared_paths:[]})});
$("#refreshPeers").onclick=()=>{expandWidget();refreshPeers()};
$("#clipText").onclick=async()=>{expandWidget();const c=await window.ttg.clipboard.readText();submit("clipboard.text",{text:c.text,targets:peers.map(x=>x.id).filter(Boolean)})};
$("#clipImage").onclick=async()=>{expandWidget();const c=await window.ttg.clipboard.readImage();submit("clipboard.image",{data_url:c.dataUrl,targets:peers.map(x=>x.id).filter(Boolean)})};
$("#openMain").onclick=()=>window.ttg.showMain();
window.ttg.onBackendEvent(evt=>{
  const job=evt?.job;
  if((evt?.type==="job.progress"||evt?.type==="job.queued")&&job&&job.id===activeJob)showJob(job);
  if(evt?.type==="job.finished"&&job&&job.id===activeJob){
    showJob(job);
    if(job.operation==="peer.list"){peers=(job.result?.peers||[]).filter(x=>!x.self&&x.approved!==false);$("#peerText").textContent=peers.length?peers.map(x=>x.name||x.host||x.id).join(", "):"No approved peers"}
    if(job.operation==="sharing.status"||job.operation==="sharing.toggle"){const s=job.result?.status||job.result;if(s?.connection)apply({connection:s.connection})}
    if(job.operation==="peer.configure"&&job.result?.peer){const role=job.result.peer.role;apply({connection:role==="receiver"?"receiving":role==="provider"?"sending":"disconnected"});window.ttg.stateSet({connection:state.connection})}
  }
  if(evt?.type==="peer.clipboard")$("#peerText").textContent="Received from "+(evt.sender_name||evt.sender_ip||"peer");
});
(async()=>{try{const s=await window.ttg.stateGet();if(s)apply(s)}catch{};window.ttg.onState(apply);apply(state)})();
</script>
</body>
</html>
