<!doctype html><html><head><meta charset="utf-8"><style>
:root{--red:#ff647f;--blue:#5fd3ff;--green:#4affaa}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#edf8ff;font-family:Segoe UI,Arial,sans-serif;overflow:hidden}
.card{width:100%;height:100%;border-radius:24px 0 0 24px;border:1px solid rgba(98,201,255,.22);border-right:0;background:linear-gradient(180deg,rgba(17,25,45,.9),rgba(5,10,21,.9));backdrop-filter:blur(20px);padding:12px;display:grid;grid-template-rows:auto auto 1fr auto;gap:9px;box-shadow:0 18px 44px rgba(0,0,0,.42)}
.top{display:flex;justify-content:space-between;align-items:center}.top b{font-size:14px}.state{width:10px;height:10px;border-radius:50%;box-shadow:0 0 14px currentColor}.disconnected{color:var(--red);background:var(--red)}.receiving{color:var(--blue);background:var(--blue)}.sending{color:var(--green);background:var(--green)}
select{width:100%;padding:8px;border-radius:12px;border:1px solid rgba(95,183,255,.15);background:#0b1325;color:white}.pane{display:grid;gap:7px;align-content:start}.pane[hidden]{display:none}.conn{padding:9px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#dcecff;opacity:.48;font-weight:700;cursor:pointer}.conn.active{opacity:1;box-shadow:0 0 16px currentColor}.conn[data-v=disconnected].active{color:var(--red);border-color:rgba(255,100,127,.4)}.conn[data-v=receiving].active{color:var(--blue);border-color:rgba(95,211,255,.4)}.conn[data-v=sending].active{color:var(--green);border-color:rgba(74,255,170,.4)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:11px}.target{display:grid;gap:5px;font-size:10px}.target label{display:flex;gap:6px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}.quick button,.open{padding:8px;border-radius:11px;border:1px solid rgba(95,183,255,.15);background:rgba(255,255,255,.04);color:#edf8ff;font-weight:700;cursor:pointer}.open{background:linear-gradient(90deg,rgba(35,223,255,.18),rgba(86,103,255,.22))}
</style></head><body><div class="card"><div class="top"><b id="title">Connection</b><span id="dot" class="state receiving"></span></div><select id="mode"><option value="connection">Connection</option><option value="clipboard">Clipboard</option></select><div class="pane" data-pane="connection"><button class="conn" data-v="disconnected">Disconnected</button><button class="conn active" data-v="receiving">Receiving</button><button class="conn" data-v="sending">Sending</button></div><div class="pane" data-pane="clipboard" hidden><div class="row"><span>Clipboard</span><span id="clipState">ON</span></div><div class="quick"><button id="textBtn">Paste text</button><button id="imgBtn">Send image</button></div><div class="target"><label><input type="checkbox" checked> KRATOS</label><label><input type="checkbox"> Android</label><label><input type="checkbox"> All approved</label></div></div><button id="open" class="open">Open iNSync</button></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let st={mode:"connection",connection:"receiving",clipboardEnabled:true};
function apply(s){st={...st,...s};$("#mode").value=st.mode;$("#title").textContent=st.mode==="clipboard"?"Clipboard":"Connection";$$(".pane").forEach(p=>p.hidden=p.dataset.pane!==st.mode);$$(".conn").forEach(b=>b.classList.toggle("active",b.dataset.v===st.connection));$("#dot").className="state "+st.connection;$("#clipState").textContent=st.clipboardEnabled?"ON":"OFF"}
async function set(p){apply({...st,...p});await window.ttg?.stateSet?.(p)}
$("#mode").onchange=e=>set({mode:e.target.value});$$(".conn").forEach(b=>b.onclick=()=>set({connection:b.dataset.v}));$("#clipState").onclick=()=>set({clipboardEnabled:!st.clipboardEnabled});$("#textBtn").onclick=()=>{};$("#imgBtn").onclick=()=>{};$("#open").onclick=()=>window.ttg?.showMain?.();(async()=>{const s=await window.ttg?.stateGet?.();if(s)apply(s);window.ttg?.onState?.(apply)})();</script></body></html>
