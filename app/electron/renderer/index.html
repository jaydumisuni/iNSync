.device-toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.72fr);gap:7px;margin-bottom:9px}.android-content{min-height:0;display:flex;flex-direction:column}.android-content .media-list,.android-content .app-list{flex:1;max-height:none;min-height:0}.media-thumb{width:42px;height:42px;object-fit:cover;border-radius:10px;border:1px solid rgba(84,188,255,.13);background:rgba(12,25,42,.9);display:block}.media-list.large .media-row{position:relative;overflow:hidden}.media-list.large .media-row:before{display:none}.media-list.large .media-thumb{width:100%;height:108px;border-radius:10px}.media-list.large .media-copy{min-width:0}.media-placeholder{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;border:1px solid rgba(82,183,255,.14);background:linear-gradient(135deg,rgba(30,210,255,.14),rgba(87,95,255,.1));font-size:9px;color:#b8dcff}.media-preview-needed{position:relative;overflow:hidden}.media-preview-needed:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.08) 42%,transparent 64%);transform:translateX(-100%);animation:previewSweep 1.25s linear infinite}@keyframes previewSweep{to{transform:translateX(100%)}}.media-list.large .media-placeholder{width:100%;height:108px;font-size:0}.media-row-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}.media-list.large .media-row-main{grid-template-columns:1fr;align-items:start}.media-list.large .media-actions{margin-top:3px}.sectiontabs.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.remote-list{max-height:260px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}.remote-list::-webkit-scrollbar{display:none;width:0}.sectiontabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}.apk-app-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}.apk-app-tools input,.wifi-adb-grid input{width:100%;min-height:34px;border-radius:10px;border:1px solid rgba(91,119,191,.35);background:rgba(8,13,21,.86);color:#dce7f5;padding:8px 10px;outline:none}.apk-app-tools input:focus,.wifi-adb-grid input:focus{border-color:rgba(67,190,255,.6);box-shadow:0 0 0 2px rgba(67,190,255,.08)}.apk-filter{margin:0}.wifi-adb-grid{display:grid;gap:10px}.wifi-adb-grid .buttonbar{margin-top:0}
.wifi-services{max-height:124px;margin:8px 0;overflow-y:auto;scrollbar-width:none}.wifi-services::-webkit-scrollbar{display:none}.app-identity{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:center;min-width:0}.app-icon{width:36px;height:36px;object-fit:contain;border-radius:9px;background:transparent;display:block}.app-icon-placeholder{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;border:1px solid rgba(82,183,255,.14);background:linear-gradient(135deg,rgba(40,184,255,.13),rgba(87,95,255,.08));font-size:8px;color:#b8dcff}.app-icon-needed{position:relative;overflow:hidden}.app-icon-needed:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.08) 42%,transparent 64%);transform:translateX(-100%);animation:previewSweep 1.25s linear infinite}.modal-body>.card>*:last-child{margin-bottom:1px}
</style>
</head>
<body>
<div id="stage">
  <img id="art" src="assets/insync-ui-disconnected.png" alt="">
  <img class="logo" src="assets/insync-logo-transparent.png" alt="iNSync">
  <button id="minBtn" class="window-btn" aria-label="Minimize">&minus;</button>
  <button id="closeBtn" class="window-btn" aria-label="Close">&times;</button>
  <button class="hotspot hs-wifi" data-module="sharing" data-label="Sharing"></button>
  <button class="hotspot hs-ps" data-module="playstation" data-label="PlayStation"></button>
  <button class="hotspot hs-xbox" data-module="xbox" data-label="Xbox"></button>
  <button class="hotspot hs-switch" data-module="switch" data-label="Switch"></button>
  <button class="hotspot hs-iphone" data-module="iphone" data-label="iPhone"></button>
  <button class="hotspot hs-ipa" data-module="ipa" data-label="IPA"></button>
  <button class="hotspot hs-apk" data-module="apk" data-label="APK"></button>
  <button class="hotspot hs-android" data-module="android" data-label="Android"></button>
  <button class="hotspot hs-folder" data-module="files" data-label="File Share"></button>
  <button class="hotspot hs-clipboard" data-module="clipboard" data-label="Clipboard"></button>
  <button class="hotspot hs-pc" data-module="pc" data-label="PC Share"></button>
  <button class="hotspot hs-home" data-module="home" data-label="Home"></button>
</div>

<div id="backdrop" class="backdrop">
  <section id="modal" class="modal">
    <header class="modal-head">
      <div id="modalTitle" class="modal-title"></div>
      <div class="modal-actions"><button id="maxModal" class="modal-window-btn" aria-label="Maximize" title="Maximize"><span class="maximize-glyph"></span></button><button id="closeModal" class="modal-window-btn close" aria-label="Close" title="Close">&times;</button></div>
    </header>
    <div id="modalBody" class="modal-body"></div>
    <div id="jobDock" class="jobdock">
      <div class="jobmeta"><div class="jobline"><span id="jobMessage">Ready</span><span id="jobPct">0%</span></div><div class="progress"><i id="jobBar"></i></div></div>
      <button id="cancelJob" class="cancel">Cancel</button>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let state={connection:"disconnected",mode:"connection",clipboardEnabled:false,clipboardAuto:false,clipboardTargets:[],clipboardTypes:{text:true,image:true},clipboardDirection:"two-way"};
let currentModule="home";
let activeJob="";
let engineSnapshot=null;
const jobs=new Map();
const recentJobs=[];
const artByState={disconnected:"assets/insync-ui-disconnected.png",receiving:"assets/insync-ui-receiving.png",sending:"assets/insync-ui-sending.png"};
const data={
  sharing:{status:null},
  pc:{peers:[],role:"idle",scope:"internet-only",sharedPaths:[],sources:[],destination:""},
  files:{sources:[],destination:"",peers:[],targets:[],mode:"send",remotePeer:"",remoteRoots:[],remoteRoot:"",remotePath:"",remoteEntries:[]},
  clipboard:{peers:[],targets:[],types:{text:true,image:true,files:false},direction:"two-way"},
  android:{devices:[],serial:"",apps:[],info:null,section:"photos",view:"list",media:{photos:[],videos:[]},previews:{},appIcons:{}},
  apk:{paths:[],section:"install",appFilter:"all",appSearch:"",wifi:{status:null,endpoint:"",pairEndpoint:"",pairCode:"",services:[]}},
  ipa:{path:"",validation:null,status:null},
  iphone:{status:null,section:"photos",view:"list",media:{photos:[],videos:[],music:[]},apps:[],documents:[],bundleId:"",page:0,previews:{}},
  playstation:{paths:[],status:null},
  xbox:{paths:[],status:null},
  switch:{paths:[],status:null}
};

const modules={
  home:{
    title:"iNSync",sub:"Share - Transfer - Install - Sync. One transport core, multiple devices.",icon:"home",
    render(){
      const c=engineSnapshot?.capabilities||{};
      return [
        '<div class="card"><h3>Transport core</h3><p>Long-running work is queued in the iNSync engine, not the renderer.</p><div class="rows">'+row("Engine","Queued worker execution",engineSnapshot?.engine?.workers?engineSnapshot.engine.workers+" workers":"Ready","green")+row("File transport","Local, mapped and UNC copy with progress/cancel",c.file_copy?"Ready":"Unavailable",c.file_copy?"green":"red")+row("Android","Photos, videos and apps through ADB",c.adb?"Ready":"ADB missing",c.adb?"green":"red")+row("iPhone","Photos, apps and Documents through the Apple device bridge",c.ios_bridge?"Ready":"Bridge missing",c.ios_bridge?"green":"red")+row("Clipboard peers","Approved peer text/image transport",c.clipboard_peer?"Ready":"Unavailable",c.clipboard_peer?"green":"red")+'</div><div class="buttonbar"><button class="secondary" data-cmd="engineRefresh">Refresh engine</button></div></div>',
        '<div class="card"><h3>Connection law</h3><div class="rows">'+row("Green","Provider / sending","Active","green")+row("Blue","Receiver / receiving","Active","blue")+row("Red","Disconnected / inactive","Off","red")+'</div><p style="margin-top:10px">Every popup is one view into the same engine. Device-specific adapters stay capability-gated when a backend is unavailable.</p></div>'
      ];
    }
  },
  sharing:{
    title:"Sharing",sub:"Flip this PC between Internet sharing and normal networking.",icon:"sharing",
    render(){
      const x=data.sharing.status||{},on=state.connection==="sending";
      return [
        '<div class="card"><h3>Internet sharing</h3><div class="row"><div><b>Current mode</b><small>'+esc(x.message||(on?"Sharing Internet":"Normal networking"))+'</small></div><div class="toggle '+(on?"on":"")+'" data-cmd="sharingToggle"><i></i></div></div><div class="grid2" style="margin-top:10px"><div class="control"><label>Internet source</label><select id="sharePublic"><option>Wi-Fi</option><option>Ethernet</option></select></div><div class="control"><label>Share to</label><select id="sharePrivate"><option>Ethernet</option><option>Wi-Fi</option></select></div></div><div class="rows">'+row("Private gateway",x.ethernetIPv4||"Ethernet",x.ethernetStatus||"Unknown",x.ethernetStatus==="Up"?"green":"")+row("Uplink",x.wifiIPv4||"Wi-Fi",x.wifiGateway?"Gateway "+x.wifiGateway:"Auto","")+'</div><div class="buttonbar"><button class="primary" data-cmd="sharingToggle">'+(on?"Back to normal":"Start sharing")+'</button><button class="secondary" data-cmd="sharingRefresh">Verify state</button></div></div>',
        '<div class="card"><h3>Connection law</h3><div class="rows">'+row("Green","This PC is sending/providing","Provider","green")+row("Blue","This PC is receiving","Receiver","blue")+row("Red","No active sharing role","Off","red")+'</div><p style="margin-top:10px">The network mutation stays in the engine and Windows elevation path. The popup only chooses and displays state.</p></div>'
      ];
    }
  },
  pc:{
    title:"PC Share",sub:"Choose provider / receiver roles, share Internet, folders, locations or the whole PC.",icon:"pc",
    render(){
      const me=localPeer();
      if(me){data.pc.role=me.role||data.pc.role;data.pc.scope=me.scope||data.pc.scope;data.pc.sharedPaths=me.shared_paths||data.pc.sharedPaths}
      const peerRows=data.pc.peers.length?data.pc.peers.slice(0,6).map(peer=>peerRowHtml(peer)).join(''):'<div class="empty-state">No iNSync peers found yet.</div>';
      return [
        '<div class="card"><h3>PCs on the network</h3><div class="rows">'+peerRows+'</div><div class="grid2" style="margin-top:10px"><div class="control"><label>This PC role</label><select id="pcRole"><option value="provider" '+(data.pc.role==="provider"?"selected":"")+'>Provider</option><option value="receiver" '+(data.pc.role==="receiver"?"selected":"")+'>Receiver</option><option value="idle" '+(data.pc.role==="idle"?"selected":"")+'>Idle</option></select></div><div class="control"><label>Share scope</label><select id="pcScope"><option value="internet-only" '+(data.pc.scope==="internet-only"?"selected":"")+'>Internet only</option><option value="internet-folders" '+(data.pc.scope==="internet-folders"?"selected":"")+'>Internet + selected folders</option><option value="selected-location" '+(data.pc.scope==="selected-location"?"selected":"")+'>Selected folder/location</option><option value="whole-pc" '+(data.pc.scope==="whole-pc"?"selected":"")+'>Whole PC (explicit)</option></select></div></div><div class="share-path">'+esc(data.pc.sharedPaths.join(" · ")||"No shared folder selected")+'</div><div class="buttonbar"><button class="secondary" data-cmd="pcChooseFolder">Choose location</button><button class="primary" data-cmd="pcApply">Apply</button><button class="secondary" data-cmd="peerRefresh">Refresh peers</button></div></div>',
        '<div class="card"><h3>Color law</h3><div class="rows">'+row("Green","Providing Internet / data","Provider","green")+row("Blue","Receiving Internet / data","Receiver","blue")+row("Red","Inactive / not sharing","Off","red")+'</div><h3 style="margin-top:14px">Trust</h3><p>Discovery is automatic. Only approved iNSync endpoints become eligible for transfer and clipboard actions.</p></div>'
      ];
    }
  },
  files:{
    title:"File Share",sub:"Send to approved iNSync peers or browse and receive from their shared locations.",icon:"files",
    render(){
      const d=data.files,q=queueJobFor("files"),targets=new Set(d.targets);
      const peers=d.peers.filter(x=>!x.self&&x.approved!==false);
      const tabs='<div class="sectiontabs two"><button class="sectiontab '+(d.mode==="send"?"active":"")+'" data-cmd="filesMode" data-mode="send">Send</button><button class="sectiontab '+(d.mode==="receive"?"active":"")+'" data-cmd="filesMode" data-mode="receive">Receive</button></div>';
      let primary="";
      if(d.mode==="send"){
        const peerChecks=peers.length?peers.map(x=>'<label class="check"><input type="checkbox" data-file-peer-id="'+esc(x.id)+'" '+(targets.has(x.id)?"checked":"")+'>'+esc(x.name||x.host||x.id)+' <small>'+esc(x.ip||"")+'</small></label>').join(""):'<div class="empty-state">No approved peers. Approve the other PC in PC Share first.</div>';
        primary='<div class="card">'+tabs+'<div class="mini-explorer"><div class="pane"><h4>PC source</h4>'+selectedPaths(d.sources,"Choose files or a folder")+'</div><div class="pane"><h4>Peer targets</h4><div class="checklist">'+peerChecks+'</div></div></div><div class="share-path">'+esc(d.destination||"Optional local / mapped / UNC destination")+'</div><div class="buttonbar"><button class="secondary" data-cmd="filesChoose">Choose files</button><button class="secondary" data-cmd="filesChooseFolder">Choose folder</button><button class="secondary" data-cmd="filesDestination">Local destination</button><button class="primary" data-cmd="filesTransfer">Send selected</button><button class="secondary" data-cmd="filesPeerRefresh">Refresh peers</button></div></div>';
      }else{
        const peerOptions=peers.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===d.remotePeer?"selected":"")+'>'+esc(x.name||x.host||x.id)+' | '+esc(x.ip||"")+'</option>').join("");
        const rootOptions=d.remoteRoots.map(x=>'<option value="'+esc(x.id)+'" '+(String(x.id)===String(d.remoteRoot)?"selected":"")+'>'+esc(x.name||x.path||x.id)+'</option>').join("");
        const entries=d.remoteEntries.length?d.remoteEntries.map(item=>'<div class="row"><div><b>'+esc(item.name)+'</b><small>'+esc(item.type)+(item.type==="file"?" | "+fmtBytes(item.size||0):"")+'</small></div><button class="secondary mini" data-cmd="'+(item.type==="folder"?"filesRemoteOpen":"filesRemoteSave")+'" data-path="'+esc(item.path)+'">'+(item.type==="folder"?"Open":"Save")+'</button></div>').join(""):'<div class="empty-state">Choose an approved peer and shared root.</div>';
        primary='<div class="card">'+tabs+'<div class="grid2"><div class="control"><label>Remote PC</label><select id="fileRemotePeer"><option value="">Choose peer</option>'+peerOptions+'</select></div><div class="control"><label>Shared root</label><select id="fileRemoteRoot"><option value="">Choose root</option>'+rootOptions+'</select></div></div><div class="share-path">'+esc(d.remotePath||"/")+'</div><div class="remote-list rows">'+entries+'</div><div class="share-path">'+esc(d.destination||"Choose a local receive folder")+'</div><div class="buttonbar"><button class="secondary" data-cmd="filesRemoteUp">Up</button><button class="secondary" data-cmd="filesDestination">Receive folder</button><button class="secondary" data-cmd="filesPeerRefresh">Refresh peers</button></div></div>';
      }
      return [
        primary,
        '<div class="card"><h3>Transfer queue</h3>'+(q?jobCard(q):'<div class="empty-state">No transfer queued.</div>')+'<div class="rows" style="margin-top:10px">'+row("Peer transport","Streamed outside the renderer",engineSnapshot?.capabilities?.peer_files?"Ready":"Unavailable",engineSnapshot?.capabilities?.peer_files?"green":"red")+row("Remote browse","Only explicitly shared roots are exposed",engineSnapshot?.capabilities?.peer_file_browse?"Ready":"Unavailable",engineSnapshot?.capabilities?.peer_file_browse?"green":"red")+row("Local copy","Local / mapped drive / UNC remains available","Ready","green")+'</div></div>'
      ];
    }
  },
  clipboard:{
    title:"Clipboard",sub:"Automatic text/image sync with approved iNSync peers.",icon:"clipboard",
    render(){
      const targets=new Set(data.clipboard.targets);
      const peers=data.clipboard.peers.filter(x=>!x.self).slice(0,12);
      const checks=peers.length?peers.map(x=>'<label class="check"><input type="checkbox" data-peer-id="'+esc(x.id)+'" '+(targets.has(x.id)?"checked":"")+' '+(x.approved===false?"disabled":"")+'>'+esc(x.name||x.host||x.id)+(x.approved===false?" | unapproved":"")+'</label>').join(''):'<div class="empty-state">No approved remote peers.</div>';
      return [
        '<div class="card"><h3>Clipboard sharing</h3><div class="row"><div><b>Auto clipboard</b><small>'+(state.clipboardAuto?"Copy here, paste on the selected peer":"Automatic sync is off")+'</small></div><div class="toggle '+(state.clipboardAuto?"on":"")+'" data-cmd="clipboardToggle"><i></i></div></div><div class="grid2" style="margin-top:10px"><div class="checklist"><label class="check"><input id="clipTypeText" type="checkbox" '+(data.clipboard.types.text?"checked":"")+'> Text</label><label class="check"><input id="clipTypeImage" type="checkbox" '+(data.clipboard.types.image?"checked":"")+'> Images</label></div><div class="checklist">'+checks+'</div></div><div class="control"><label>Direction</label><select id="clipDirection"><option value="two-way">Two-way</option><option value="send">Send only</option><option value="receive">Receive only</option></select></div><div class="buttonbar"><button class="primary" data-cmd="clipboardApply">Apply selection</button><button class="secondary" data-cmd="clipAll">All approved</button><button class="secondary" data-cmd="clipText">Send current text</button><button class="secondary" data-cmd="clipImage">Send current image</button><button class="secondary" data-cmd="clipPeers">Refresh peers</button></div></div>',
        '<div class="card"><h3>Targets</h3><div class="rows">'+row("Auto sync","System clipboard watcher",state.clipboardAuto?"ON":"OFF",state.clipboardAuto?"green":"red")+row("Selected peers","Approved endpoints only",data.clipboard.targets.length+" selected","")+row("Paste behavior","Remote clipboard is written into Windows",state.clipboardEnabled?"Ready":"Off",state.clipboardEnabled?"green":"red")+row("Transport","Peer delivery capability",engineSnapshot?.capabilities?.clipboard_peer||"Pending","")+'</div></div>'
      ];
    }
  },
  android:{
    title:"Android",sub:"Browse phone photos, videos and apps through ADB.",icon:"android",
    render(){
      const d=data.android,info=d.info?.device||{},storage=d.info?.storage||{},section=d.section||"photos";
      const labels={photos:"Photos",videos:"Videos",apps:"Apps"};
      const tabs=["photos","videos","apps"].map(x=>'<button class="sectiontab '+(section===x?"active":"")+'" data-cmd="androidSection" data-section="'+x+'">'+labels[x]+'</button>').join("");
      const viewbar='<div class="viewbar"><button class="view-btn '+(d.view==="list"?"active":"")+'" data-cmd="androidView" data-view="list"><span class="view-list-icon"></span>List</button><button class="view-btn '+(d.view==="large"?"active":"")+'" data-cmd="androidView" data-view="large"><span class="view-large-icon"></span>Large</button></div>';
      let body="";
      if(section==="apps"){
        body='<div class="app-list">'+(d.apps.length?d.apps.map(app=>'<div class="app-row"><div class="app-identity">'+appIconFor(app)+'<div><b>'+esc(app.package)+'</b><span>'+esc(app.kind||"app")+'</span></div></div><div class="app-actions"><button class="danger mini" data-cmd="appUninstall" data-package="'+esc(app.package)+'">Delete</button></div></div>').join(""):'<div class="empty-state">Choose Refresh Apps from Android tools.</div>')+'</div>';
      }else{
        const list=d.media[section]||[];
        body='<div class="media-list '+d.view+'">'+(list.length?list.map(item=>androidMediaRow(item)).join(""):'<div class="empty-state">No '+section+' loaded. Choose Refresh '+labels[section]+' from Android tools.</div>')+'</div>';
      }
      const deviceLabel=d.serial||d.devices[0]?.serial||"Auto / first device";
      return [
        '<div class="card android-content"><div class="sectiontabs three">'+tabs+'</div>'+viewbar+body+'</div>',
        '<div class="card"><h3>Device</h3><div class="device-toolbar">'+lumiDevicePicker(deviceLabel)+lumiAndroidTools()+'</div><div class="rows">'+row("ADB",d.devices.length?deviceLabel:"No device",d.devices.length?"Ready":"Disconnected",d.devices.length?"green":"red")+row("Model",((info.manufacturer||"")+" "+(info.model||"")).trim()||"Refresh device",info.android?"Android "+info.android:"Unknown","")+row("Storage",storage.free!==undefined?fmtBytes(storage.free)+" free":"Refresh device",storage.total?fmtBytes(storage.total):"Unknown","")+row("Photos / Videos","MediaStore list, save to PC and delete","Ready",d.devices.length?"green":"")+row("Apps","User and system packages","Direct",d.devices.length?"green":"")+'</div></div>'
      ];
    }
  },
  apk:{
    title:"APK",sub:"Install packages, manage installed apps and control Wi-Fi ADB.",icon:"apk",
    render(){
      const d=data.android,a=data.apk,paths=a.paths,deviceLabel=d.serial||d.devices[0]?.serial||"Auto / first device",section=a.section||"install";
      const tabs=["install","apps","wifi"].map(x=>'<button class="sectiontab '+(section===x?"active":"")+'" data-cmd="apkSection" data-section="'+x+'">'+(x==="install"?"Install":x==="apps"?"Apps":"Wi-Fi ADB")+'</button>').join("");
      let body="",side="";
      if(section==="apps"){
        const q=(a.appSearch||"").trim().toLowerCase(),filter=a.appFilter||"all";
        const apps=d.apps.filter(app=>(filter==="all"||app.kind===filter)&&(!q||app.package.toLowerCase().includes(q)));
        body='<div class="apk-app-tools"><input id="apkAppSearch" type="text" value="'+esc(a.appSearch||"")+'" placeholder="Search installed apps"><div class="viewbar apk-filter"><button class="view-btn '+(filter==="all"?"active":"")+'" data-cmd="apkAppFilter" data-filter="all">All</button><button class="view-btn '+(filter==="user"?"active":"")+'" data-cmd="apkAppFilter" data-filter="user">User</button><button class="view-btn '+(filter==="system"?"active":"")+'" data-cmd="apkAppFilter" data-filter="system">System</button></div></div><div class="app-list">'+(apps.length?apps.map(app=>'<div class="app-row"><div class="app-identity">'+appIconFor(app)+'<div><b>'+esc(app.package)+'</b><span>'+esc(app.kind||"app")+'</span></div></div><div class="app-actions"><button class="secondary mini" data-cmd="appGet" data-package="'+esc(app.package)+'">Get</button><button class="danger mini" data-cmd="appUninstall" data-package="'+esc(app.package)+'">Delete</button></div></div>').join(""):'<div class="empty-state">No matching apps loaded.</div>')+'</div><div class="buttonbar"><button class="secondary" data-cmd="apkAppsRefresh">Refresh Apps</button></div>';
      }else if(section==="wifi"){
        const w=a.wifi||{},st=w.status||{},wireless=st.wireless_devices||[];
        body='<div class="wifi-adb-grid"><div class="control"><label>Connect endpoint</label><input id="wifiEndpoint" type="text" value="'+esc(w.endpoint||"")+'" placeholder="192.168.1.25:5555"></div><div class="buttonbar"><button class="secondary" data-cmd="wifiStatus">Status</button><button class="primary" data-cmd="wifiEnable">Enable 5555</button><button class="secondary" data-cmd="wifiConnect">Connect</button><button class="secondary" data-cmd="wifiDisconnect">Disconnect</button><button class="secondary" data-cmd="wifiUsb">USB mode</button></div><div class="rows">'+row("ADB enabled",st.adb_enabled==="1"?"Android debugging enabled":"Unknown / off",st.adb_enabled==="1"?"ON":"Check",st.adb_enabled==="1"?"green":"")+row("Phone Wi-Fi",st.wlan_ip||"No wlan0 IPv4 read",st.tcp_port==="5555"?"TCP 5555":(wireless.length?wireless.length+" wireless":"USB"),wireless.length?"blue":"")+row("Wireless devices",wireless.map(x=>x.serial).join(", ")||"None connected",wireless.length?"Connected":"None",wireless.length?"green":"red")+'</div></div>';
        const services=w.services||[];
        const serviceRows=services.length?services.map(item=>'<div class="app-row"><div><b>'+esc(item.kind==="pairing"?"Pairing service":"Connect service")+'</b><span>'+esc(item.endpoint||"")+'</span></div><button class="secondary mini" data-cmd="wifiUseService" data-kind="'+esc(item.kind||"")+'" data-endpoint="'+esc(item.endpoint||"")+'">Use</button></div>').join(""):'<div class="empty-state">No Wireless debugging mDNS services discovered.</div>';

        data.android.serial=usb?.serial||r.devices.find(x=>x.state==="device")?.serial||"";
      }
    }
    if(["adb.wifi.enable","adb.wifi.connect","adb.wifi.disconnect","adb.wifi.usb"].includes(job.operation))submit("adb.devices",{},currentModule,true);
  }
  if(job.operation==="adb.media.list"&&r.kind)data.android.media[r.kind]=r.items||[];
  if(job.operation==="adb.media.preview"&&r.remote_path){data.android.previews[r.remote_path]=r.data_url||"";previewPending.delete("android:"+r.remote_path)}
  if(job.operation==="adb.app.icon"&&r.package){data.android.appIcons[r.package]=r.data_url||"failed";previewPending.delete("app:"+r.package)}
  if(job.operation==="adb.media.delete"&&r.kind)submit("adb.media.list",{serial:data.android.serial,kind:r.kind},"android",true);
  if(job.operation==="adb.uninstall"||job.operation==="adb.disable")submit("adb.apps",{serial:data.android.serial},currentModule==="apk"?"apk":"android",true);
  if(job.operation==="ios.status"){if(meta.context==="ipa")data.ipa.status=r;else data.iphone.status=r}
  if(job.operation==="ios.validate"){data.ipa.validation=r;if(r.ok&&meta.context==="validate-install")submit("ios.ipa",{path:data.ipa.path},"ipa",false)}
  if(job.operation==="ios.apps")data.iphone.apps=r.apps||[];
  if(job.operation==="ios.media.list"&&r.kind)data.iphone.media[r.kind]=r.items||[];
  if(job.operation==="ios.media.preview"&&r.remote_path){data.iphone.previews[r.remote_path]=r.data_url||"";previewPending.delete("iphone:"+r.remote_path)}
  if(job.operation==="ios.documents.list"){data.iphone.documents=r.items||[];if(r.bundle_id)data.iphone.bundleId=r.bundle_id}
  if(job.operation==="ios.app.uninstall")submit("ios.apps",{},"iphone",true);
  if(job.operation==="ios.media.delete"&&r.kind)submit("ios.media.list",{kind:r.kind},"iphone",true);
  if(job.operation==="ios.documents.delete")submit("ios.documents.list",{bundle_id:data.iphone.bundleId},"iphone",true);
  if(job.operation==="console.status"&&meta.context&&data[meta.context])data[meta.context].status=r;
  if(job.operation==="console.pkg"&&meta.context&&data[meta.context])data[meta.context].status=r;
  if($("#backdrop").classList.contains("open"))renderModule();
}
window.ttg.onBackendEvent(evt=>{
  if(!evt)return;const job=evt.job;
  if((evt.type==="job.progress"||evt.type==="job.queued")&&job){updateRemembered(job);if(job.id===activeJob)setJob(job);if($("#backdrop").classList.contains("open"))renderModule()}
  if(evt.type==="job.finished"&&job)handleFinished(job);
  if(evt.type==="sharing.state"&&evt.connection)apply({connection:evt.connection});
  if(evt.type==="peer.clipboard")toast("Clipboard received from "+(evt.sender_name||evt.sender_ip||"peer"));if(evt.type==="peer.file.received")toast("File received from "+(evt.sender_name||evt.sender_ip||"peer"));
});

const previewPending=new Set();
let previewObserver=null;
function requestPreviewNode(node){
  const pkg=node.dataset.appPackage||"";
  if(pkg){
    const key="app:"+pkg;
    if(data.android.appIcons[pkg]||previewPending.has(key))return;
    previewPending.add(key);
    submit("adb.app.icon",{serial:data.android.serial,package:pkg},"app-icon",true);
    return;
  }
  const platform=node.dataset.previewPlatform||"",path=node.dataset.previewPath||"",kind=node.dataset.previewKind||"photos";
  if(!platform||!path)return;
  const store=platform==="android"?data.android.previews:data.iphone.previews;
  const key=platform+":"+path;
  if(store[path]||previewPending.has(key))return;
  previewPending.add(key);
  if(platform==="android")submit("adb.media.preview",{serial:data.android.serial,remote_path:path,kind},"android-preview",true);
  else submit("ios.media.preview",{kind,remote_path:path},"iphone-preview",true);
}
function schedulePreviewHydration(){
  if(previewObserver){previewObserver.disconnect();previewObserver=null}
  const nodes=$$(".media-preview-needed,.app-icon-needed");
  if(!nodes.length)return;
  if("IntersectionObserver" in window){
    previewObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){requestPreviewNode(entry.target);previewObserver.unobserve(entry.target)}}),{root:null,rootMargin:"180px 0px"});
    nodes.forEach(node=>previewObserver.observe(node));
  }else nodes.slice(0,24).forEach(requestPreviewNode);
}

function syncFileTargets(){data.files.targets=$$("[data-file-peer-id]:checked").map(x=>x.dataset.filePeerId)}
function syncClipboardControls(){
  data.clipboard.types.text=!!$("#clipTypeText")?.checked;data.clipboard.types.image=!!$("#clipTypeImage")?.checked;data.clipboard.types.files=!!$("#clipTypeFiles")?.checked;
  data.clipboard.direction=$("#clipDirection")?.value||"two-way";data.clipboard.targets=$$("[data-peer-id]:checked").map(x=>x.dataset.peerId);
}
async function command(cmd,b){

  if(cmd==="filesPeerRefresh"){submit("peer.list",{},"files",true);return}
  if(cmd==="filesChoose"){const r=await window.ttg.dialog.openFiles({title:"Choose files",multi:true});if(!r.canceled){data.files.sources=r.paths;renderModule()}return}
  if(cmd==="filesChooseFolder"){const r=await window.ttg.dialog.openFolder({title:"Choose source folder"});if(!r.canceled){data.files.sources=[r.path];renderModule()}return}

  if(cmd==="filesTransfer"){syncFileTargets();if(data.files.targets.length){submit("peer.files.send",{sources:data.files.sources,targets:data.files.targets},"files");return}if(data.files.destination){submit("files.copy",{sources:data.files.sources,destination:data.files.destination},"files");return}toast("Choose an approved peer or local destination");return}
  if(cmd==="filesRemoteOpen"){data.files.remotePath=b.dataset.path||"";submit("peer.files.list",{peer_id:data.files.remotePeer,root_id:data.files.remoteRoot,path:data.files.remotePath},"files",true);return}
  if(cmd==="filesRemoteUp"){const parts=(data.files.remotePath||"").split("/").filter(Boolean);parts.pop();data.files.remotePath=parts.join("/");if(data.files.remotePeer&&data.files.remoteRoot!=="")submit("peer.files.list",{peer_id:data.files.remotePeer,root_id:data.files.remoteRoot,path:data.files.remotePath},"files",true);return}
  if(cmd==="filesRemoteSave"){if(!data.files.destination){const r=await window.ttg.dialog.openFolder({title:"Choose receive folder"});if(r.canceled)return;data.files.destination=r.path}submit("peer.files.pull",{peer_id:data.files.remotePeer,root_id:data.files.remoteRoot,path:b.dataset.path||"",destination:data.files.destination},"files");return}
  if(cmd==="clipboardToggle"){syncClipboardControls();const next=!state.clipboardAuto;if(next&&!data.clipboard.targets.length)data.clipboard.targets=data.clipboard.peers.filter(x=>!x.self&&x.approved!==false).map(x=>x.id);const updated=await window.ttg.stateSet({mode:"clipboard",clipboardEnabled:next,clipboardAuto:next,clipboardTargets:data.clipboard.targets,clipboardTypes:{text:data.clipboard.types.text,image:data.clipboard.types.image},clipboardDirection:data.clipboard.direction});if(updated)apply(updated);renderModule();return}
  if(cmd==="clipboardApply"){syncClipboardControls();const updated=await window.ttg.stateSet({mode:"clipboard",clipboardEnabled:state.clipboardEnabled,clipboardAuto:state.clipboardAuto,clipboardTargets:data.clipboard.targets,clipboardTypes:{text:data.clipboard.types.text,image:data.clipboard.types.image},clipboardDirection:data.clipboard.direction});if(updated)apply(updated);toast("Clipboard selection applied");renderModule();return}
  if(cmd==="clipAll"){data.clipboard.targets=data.clipboard.peers.filter(x=>!x.self&&x.approved!==false).map(x=>x.id);const updated=await window.ttg.stateSet({clipboardTargets:data.clipboard.targets});if(updated)apply(updated);renderModule();return}
  if(cmd==="clipText"){syncClipboardControls();const c=await window.ttg.clipboard.readText();submit("clipboard.text",{text:c.text,targets:data.clipboard.targets,direction:data.clipboard.direction},"clipboard");return}
  if(cmd==="clipImage"){syncClipboardControls();const c=await window.ttg.clipboard.readImage();submit("clipboard.image",{data_url:c.dataUrl,targets:data.clipboard.targets,direction:data.clipboard.direction},"clipboard");return}
  if(cmd==="adbRefresh"){submit("adb.devices",{},currentModule,true);return}
  if(cmd==="apkBrowse"){const r=await window.ttg.dialog.openFiles({title:"Choose Android package",multi:true,filters:[{name:"Android packages",extensions:["apk","apks","xapk"]}]});if(!r.canceled){data.apk.paths=r.paths;renderModule()}return}

  if(cmd==="apkSection"){data.apk.section=b.dataset.section||"install";renderModule();if(data.apk.section==="apps")submit("adb.apps",{serial:data.android.serial},"apk",true);if(data.apk.section==="wifi")submit("adb.wifi.status",{serial:data.android.serial},"apk",true);return}

  if(cmd==="wifiDisconnect"){const endpoint=$("#wifiEndpoint")?.value.trim()||data.apk.wifi.endpoint||data.android.serial||"";data.apk.wifi.endpoint=endpoint;submit("adb.wifi.disconnect",{endpoint,serial:data.android.serial},"apk");return}
