<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iNSync</title>
<style>
:root{--red:#ff5d7b;--blue:#59ccff;--green:#42f79d;--text:#eef9ff;--muted:#a9bfd6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:Segoe UI,Inter,Arial,sans-serif}
button,select,input{font:inherit}
#stage{position:fixed;inset:0;background:transparent;-webkit-app-region:drag}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.logo{position:absolute;left:42.2%;bottom:3.2%;width:15.6%;height:auto;z-index:8;pointer-events:none;filter:drop-shadow(0 0 14px rgba(75,166,255,.45))}
.hotspot,.window-btn,.modal,.modal *{-webkit-app-region:no-drag}
.hotspot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer;border-radius:30%;outline:none}
.hotspot::after{content:attr(data-label);position:absolute;left:50%;bottom:0;transform:translate(-50%,75%);opacity:0;pointer-events:none;white-space:nowrap;padding:5px 8px;border-radius:999px;background:rgba(10,18,34,.78);border:1px solid rgba(88,189,255,.18);backdrop-filter:blur(14px);color:#eaf8ff;font-size:10px;font-weight:700;transition:.14s}
.hotspot:hover{filter:drop-shadow(0 0 11px #34d8ff)}
.hotspot:hover::after{opacity:1;transform:translate(-50%,100%)}
.hs-wifi{left:37%;top:0;width:25%;height:18%}.hs-ps{left:18%;top:5%;width:29%;height:27%}.hs-xbox{left:57%;top:4%;width:29%;height:26%}.hs-switch{left:71%;top:22%;width:29%;height:22%}.hs-iphone{left:2%;top:23%;width:23%;height:24%}.hs-ipa{left:0;top:39%;width:19%;height:19%}.hs-android{left:78%;top:39%;width:22%;height:20%}.hs-folder{left:79%;top:54%;width:21%;height:20%}.hs-clipboard{left:82%;top:70%;width:18%;height:20%}.hs-pc{left:0;top:71%;width:30%;height:20%}.hs-home{left:25%;top:31%;width:50%;height:62%;border-radius:46%;z-index:3}
.window-btn{position:absolute;top:38.3%;z-index:12;width:36px;height:36px;border-radius:13px;border:1px solid rgba(104,184,255,.18);background:linear-gradient(180deg,rgba(16,26,48,.72),rgba(6,12,25,.58));backdrop-filter:blur(14px);color:#e9f8ff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.32);font-size:20px}
.window-btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(0,0,0,.36),0 0 15px rgba(79,185,255,.18)}
#minBtn{left:28.5%;padding-bottom:6px}#closeBtn{right:28.5%;color:#ffdbe4;border-color:rgba(255,92,124,.22);background:linear-gradient(180deg,rgba(56,14,29,.72),rgba(29,7,15,.58))}
.backdrop{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.22);backdrop-filter:blur(8px);-webkit-app-region:no-drag}
.backdrop.open{display:flex}
.modal{width:min(690px,84vw);height:min(420px,61vh);overflow:hidden;border-radius:24px;border:1px solid rgba(91,190,255,.18);background:linear-gradient(180deg,rgba(20,31,54,.7),rgba(6,12,25,.66));backdrop-filter:blur(26px);box-shadow:0 24px 70px rgba(0,0,0,.48);padding:13px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px;transition:.16s}
.modal.max{width:min(800px,95vw);height:min(650px,90vh);padding:16px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:9px;border-bottom:1px solid rgba(95,185,255,.11)}
.modal-copy h2{margin:0;font-size:18px}.modal-copy p{margin:3px 0 0;color:var(--muted);font-size:10px}.modal.max .modal-copy h2{font-size:24px}.modal.max .modal-copy p{font-size:12px}
.modal-actions{display:flex;gap:7px}.modal-actions button{width:36px;height:36px;border-radius:12px;border:1px solid rgba(83,178,255,.15);background:rgba(255,255,255,.04);color:#fff;cursor:pointer;font-size:18px}.modal-actions .x{color:#ffdbe4;border-color:rgba(255,92,124,.2);background:rgba(70,17,34,.25)}
.modal-body{min-height:0;display:grid;grid-template-columns:1.15fr .85fr;gap:9px;overflow:hidden}
.card{min-height:0;overflow:hidden;border-radius:17px;border:1px solid rgba(91,181,255,.1);background:rgba(13,22,40,.42);padding:10px;display:flex;flex-direction:column}
.card h3{margin:0 0 7px;font-size:13px}.card p{margin:0;color:var(--muted);font-size:9.5px;line-height:1.42}.modal.max .card h3{font-size:16px}.modal.max .card p{font-size:11.5px}
.rows{display:grid;gap:6px;margin-top:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px;border-radius:12px;border:1px solid rgba(89,180,255,.08);background:rgba(255,255,255,.025)}.row b{font-size:9.5px}.row small{display:block;margin-top:2px;color:var(--muted);font-size:8.5px}.modal.max .row b{font-size:11.5px}.modal.max .row small{font-size:10px}
.tag{padding:4px 7px;border-radius:999px;border:1px solid rgba(87,190,255,.17);font-size:8px;color:#dcf6ff;background:rgba(74,167,255,.06)}.tag.green{color:#c3ffdc;border-color:rgba(66,247,157,.22)}.tag.red{color:#ffd2db;border-color:rgba(255,93,123,.22)}.tag.blue{color:#c9efff;border-color:rgba(89,204,255,.24)}
.field{display:grid;gap:4px;margin-top:7px}.field label{font-size:8px;text-transform:uppercase;letter-spacing:.09em;color:#a8c2dc}.field select,.field input{width:100%;padding:7px 8px;border-radius:10px;border:1px solid rgba(88,180,255,.12);background:#0b1324;color:#fff;font-size:9px;outline:none}
.buttons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.buttons button{padding:7px 9px;border-radius:10px;font-size:9px;font-weight:700;cursor:pointer}.primary{border:0;background:linear-gradient(90deg,#25dcff,#5968ff);color:#001019}.secondary{border:1px solid rgba(88,180,255,.12);background:rgba(255,255,255,.04);color:#eaf8ff}.danger{border:1px solid rgba(255,93,123,.2);background:rgba(255,93,123,.09);color:#ffd5dd}
.pathbox{margin-top:7px;padding:7px 8px;border-radius:11px;border:1px dashed rgba(90,181,255,.16);background:rgba(0,0,0,.12);font-size:8.5px;color:#d9edff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mini-list{display:grid;gap:5px;margin-top:7px}.mini-item{padding:6px 7px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid rgba(90,180,255,.07);font-size:8.5px;color:#dbeeff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobdock{display:none;align-items:center;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:8px 9px;border-radius:14px;border:1px solid rgba(89,190,255,.12);background:rgba(8,16,30,.62)}
.jobdock.show{display:grid}.jobmeta{min-width:0}.jobline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:8.5px;color:#d9edff}.jobline span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{height:6px;margin-top:5px;border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden}.progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#27dfff,#5f74ff);border-radius:999px;transition:width .15s}.cancel{padding:6px 8px;border-radius:9px;border:1px solid rgba(255,93,123,.18);background:rgba(255,93,123,.08);color:#ffd7df;font-size:8px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:12px;z-index:80;transform:translate(-50%,16px);opacity:0;padding:7px 10px;border-radius:999px;background:rgba(9,17,31,.9);border:1px solid rgba(82,189,255,.2);color:#e9f8ff;font-size:9px;transition:.16s;-webkit-app-region:no-drag}#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="stage">
  <img id="art" src="assets/insync-ui-disconnected.png" alt="">
  <img class="logo" src="assets/insync-logo-transparent.png" alt="iNSync">
  <button id="minBtn" class="window-btn" aria-label="Minimize">−</button>
  <button id="closeBtn" class="window-btn" aria-label="Close">×</button>
  <button class="hotspot hs-wifi" data-module="sharing" data-label="Sharing"></button>
  <button class="hotspot hs-ps" data-module="playstation" data-label="PlayStation"></button>
  <button class="hotspot hs-xbox" data-module="xbox" data-label="Xbox"></button>
  <button class="hotspot hs-switch" data-module="switch" data-label="Switch"></button>
  <button class="hotspot hs-iphone" data-module="iphone" data-label="iPhone / IPA"></button>
  <button class="hotspot hs-ipa" data-module="iphone" data-label="IPA"></button>
  <button class="hotspot hs-android" data-module="android" data-label="Android / APK"></button>
  <button class="hotspot hs-folder" data-module="files" data-label="File Share"></button>
  <button class="hotspot hs-clipboard" data-module="clipboard" data-label="Clipboard"></button>
  <button class="hotspot hs-pc" data-module="pc" data-label="PC Share"></button>
  <button class="hotspot hs-home" data-module="home" data-label="Home"></button>
</div>

<div id="backdrop" class="backdrop">
  <section id="modal" class="modal">
    <header class="modal-head">
      <div class="modal-copy"><h2 id="modalTitle"></h2><p id="modalSub"></p></div>
      <div class="modal-actions"><button id="maxModal" aria-label="Maximize">▢</button><button id="closeModal" class="x" aria-label="Close">×</button></div>
    </header>
    <div id="modalBody" class="modal-body"></div>
    <div id="jobDock" class="jobdock">
      <div class="jobmeta"><div class="jobline"><span id="jobMessage">Ready</span><span id="jobPct">0%</span></div><div class="progress"><i id="jobBar"></i></div></div>
      <button id="cancelJob" class="cancel">Cancel</button>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let state={connection:"disconnected",mode:"connection",clipboardEnabled:true};
let currentModule="home";
let activeJob="";
const artByState={disconnected:"assets/insync-ui-disconnected.png",receiving:"assets/insync-ui-receiving.png",sending:"assets/insync-ui-sending.png"};
const data={
  files:{sources:[],destination:""},
  pc:{sources:[],destination:"",peers:[]},
  android:{devices:[],serial:"",apk:"",apps:[],app:""},
  iphone:{ipa:"",devices:[]},
  playstation:{paths:[]},
  xbox:{paths:[]},
  switch:{paths:[]},
  clipboard:{peers:[],targets:[]},
  sharing:{status:null}
};

function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(t){const n=$("#toast");n.textContent=t;n.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>n.classList.remove("show"),1400)}
function apply(s){state={...state,...s};$("#art").src=artByState[state.connection]||artByState.disconnected}
function rows(items){return '<div class="rows">'+items.map(x=>'<div class="row"><div><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></div><span class="tag '+(x[3]||'')+'">'+esc(x[2])+'</span></div>').join('')+'</div>'}
function pathBox(label,value){return '<div class="field"><label>'+label+'</label><div class="pathbox">'+esc(value||"Not selected")+'</div></div>'}
function shortList(items){return '<div class="mini-list">'+(items.length?items.slice(0,4).map(x=>'<div class="mini-item">'+esc(x)+'</div>').join(''):'<div class="mini-item">Nothing selected</div>')+'</div>'}
function optionList(items,valueFn,labelFn,selected){return items.map(x=>{const v=valueFn(x),l=labelFn(x);return '<option value="'+esc(v)+'" '+(v===selected?'selected':'')+'>'+esc(l)+'</option>'}).join('')}

const modules={
  home:{
    title:"iNSync",sub:"One transport core; the UI only submits work to the engine.",
    render(){return [
      '<div class="card"><h3>Engine</h3>'+rows([
        ["UI thread","Only selection, state and progress rendering.","Non-blocking","green"],
        ["Job workers","Transport/device operations run out of process.","2 workers","blue"],
        ["Cancellation","Running jobs can be stopped from the popup.","Enabled","green"]
      ])+'<div class="buttons"><button class="secondary" data-cmd="engineSnapshot">Refresh engine</button></div></div>',
      '<div class="card"><h3>Capability routing</h3><p>ADB and local/network file-copy paths are live. Windows sharing is bound behind an elevated engine job. iOS and console actions only activate when their qualified adapter exists.</p></div>'
    ]}
  },
  sharing:{
    title:"Sharing",sub:"Normal networking ↔ Internet sharing. Runs in the engine; Windows approval only when a mutation needs elevation.",
    render(){
      const s=data.sharing.status||{};
      const on=state.connection==="sending";
      return [
        '<div class="card"><h3>Internet Sharing</h3>'+rows([
          ["State",s.message||"Read current state",""+(on?"Sharing":"Off"),on?"green":"red"],
          ["Private side",s.ethernetIPv4||"Ethernet",""+(s.ethernetStatus||"Unknown"),""],
          ["Uplink",s.wifiIPv4||"Wi-Fi",s.wifiGateway?"Gateway "+s.wifiGateway:"Auto",""]
        ])+'<div class="split2"><div class="field"><label>Internet source</label><select id="sharePublic"><option>Wi-Fi</option><option>Ethernet</option></select></div><div class="field"><label>Share to</label><select id="sharePrivate"><option>Ethernet</option><option>Wi-Fi</option></select></div></div><div class="buttons"><button class="secondary" data-cmd="sharingRefresh">Refresh</button><button class="primary" data-cmd="sharingToggle">'+(on?"Back to normal":"Start sharing")+'</button></div></div>',
        '<div class="card"><h3>Contract</h3><p>iNSync captures the private-side baseline, clears stale ICS flags, applies the private gateway, verifies the public/private pair, and restores the saved baseline when sharing is disabled.</p></div>'
      ]
    }
  },
  pc:{
    title:"PC Share",sub:"Use local, mapped or UNC destinations now; approved iNSync peer discovery plugs into the same engine contract.",
    render(){
      return [
        '<div class="card"><h3>Send / Receive</h3>'+pathBox("Source",data.pc.sources.join(" • ")) + pathBox("Destination",data.pc.destination) + '<div class="buttons"><button class="secondary" data-cmd="pcFiles">Choose files</button><button class="secondary" data-cmd="pcFolder">Choose source folder</button><button class="secondary" data-cmd="pcDestination">Choose destination</button><button class="primary" data-cmd="pcTransfer">Transfer</button></div></div>',
        '<div class="card"><h3>Approved peers</h3>'+shortList(data.pc.peers.map(x=>x.name||x.host||x.id))+'<div class="buttons"><button class="secondary" data-cmd="peerRefresh">Refresh peers</button></div><p style="margin-top:7px">Until pairing is qualified, mapped drives and UNC paths remain usable without pretending an unapproved LAN device is trusted.</p></div>'
      ]
    }
  },
  files:{
    title:"File Share",sub:"Explorer selection in the UI; copy/receive work and progress run in the engine.",
    render(){return [
      '<div class="card"><h3>Explorer</h3>'+pathBox("Source",data.files.sources.join(" • "))+pathBox("Destination",data.files.destination)+'<div class="buttons"><button class="secondary" data-cmd="filesChoose">Choose files</button><button class="secondary" data-cmd="filesChooseFolder">Choose folder</button><button class="secondary" data-cmd="filesDestination">Destination</button><button class="primary" data-cmd="filesTransfer">Start transfer</button></div></div>',
      '<div class="card"><h3>Selected</h3>'+shortList(data.files.sources)+'<p style="margin-top:7px">The engine scans the copy plan, streams progress, supports cancellation, and works with normal folders, mapped drives and UNC paths.</p></div>'
    ]}
  },
  clipboard:{
    title:"Clipboard",sub:"Text and images are selected in Electron, but peer delivery is an engine job.",
    render(){return [
      '<div class="card"><h3>Clipboard Send</h3>'+rows([
        ["Text","Read the current clipboard and send to selected approved peers.","Ready","green"],
        ["Image","Read the current clipboard image and send selectively.","Ready","blue"]
      ])+'<div class="buttons"><button class="primary" data-cmd="clipText">Paste text</button><button class="secondary" data-cmd="clipImage">Send image</button></div></div>',
      '<div class="card"><h3>Targets</h3>'+shortList(data.clipboard.peers.map(x=>x.name||x.host||x.id))+'<div class="buttons"><button class="secondary" data-cmd="clipPeers">Refresh peers</button></div><p style="margin-top:7px">No unknown LAN device is treated as approved. Pairing/approval is the next transport adapter boundary.</p></div>'
    ]}
  },
  android:{
    title:"Android / ADB",sub:"Device discovery, APK install and app management all run in the engine.",
    render(){
      const devices=data.android.devices;
      const apps=data.android.apps;
      return [
        '<div class="card"><h3>Android Device</h3><div class="field"><label>ADB device</label><select id="adbDevice"><option value="">Auto / first device</option>'+optionList(devices,x=>x.serial,x=>x.serial+" · "+x.state,data.android.serial)+'</select></div>'+pathBox("APK",data.android.apk)+'<div class="buttons"><button class="secondary" data-cmd="adbRefresh">Refresh devices</button><button class="secondary" data-cmd="apkBrowse">Choose APK</button><button class="primary" data-cmd="apkInstall">Install APK</button></div></div>',
        '<div class="card"><h3>Applications</h3><div class="field"><label>User app</label><select id="adbApp"><option value="">Choose app</option>'+apps.map(a=>'<option value="'+esc(a)+'" '+(a===data.android.app?'selected':'')+'>'+esc(a)+'</option>').join('')+'</select></div><div class="buttons"><button class="secondary" data-cmd="appsRefresh">List apps</button><button class="danger" data-cmd="appUninstall">Uninstall</button></div><p style="margin-top:7px">System-app destructive actions are not exposed by this screen.</p></div>'
      ]
    }
  },
  iphone:{
    title:"iPhone / IPA",sub:"Uses libimobiledevice/ideviceinstaller when present; otherwise the capability stays gated.",
    render(){return [
      '<div class="card"><h3>iPhone</h3>'+pathBox("IPA",data.iphone.ipa)+'<div class="buttons"><button class="secondary" data-cmd="iosStatus">Device status</button><button class="secondary" data-cmd="ipaBrowse">Choose IPA</button><button class="primary" data-cmd="ipaInstall">Install IPA</button></div></div>',
      '<div class="card"><h3>Capability</h3><p>Signing, provisioning and device-service requirements are checked by the backend. Unsupported states are reported instead of using a fake universal install path.</p></div>'
    ]}
  },
  playstation:{title:"PlayStation / PKG",sub:"Package selection and queue UI are live; the console-specific install adapter remains capability-gated.",render(){return consoleRender("playstation","PlayStation",["pkg"])}},
  xbox:{title:"Xbox",sub:"Shared storage/transfer workflow; backend actions stay console-specific.",render(){return consoleRender("xbox","Xbox",["appx","msix","zip"])}},
  switch:{title:"Nintendo Switch",sub:"Shared storage/transfer workflow; backend actions stay console-specific.",render(){return consoleRender("switch","Nintendo Switch",["nsp","xci","zip"])}}
};

function consoleRender(key,label,extensions){
  const d=data[key];
  return [
    '<div class="card"><h3>'+label+'</h3>'+pathBox("Packages",d.paths.join(" • "))+'<div class="buttons"><button class="secondary" data-console="'+key+'" data-ext="'+extensions.join(",")+'" data-cmd="consoleBrowse">Choose package</button><button class="secondary" data-console="'+key+'" data-cmd="consoleStatus">Check console</button><button class="primary" data-console="'+key+'" data-cmd="consoleInstall">Queue install</button></div></div>',
    '<div class="card"><h3>Backend boundary</h3><p>Package selection is functional now. Install/storage operations only become active when the corresponding qualified console adapter is present.</p></div>'
  ]
}

function renderModule(){
  const m=modules[currentModule]||modules.home;
  $("#modalTitle").textContent=m.title;$("#modalSub").textContent=m.sub;
  const parts=m.render();
  $("#modalBody").innerHTML=parts.join("");
  wireControls();
}
function openModule(key){currentModule=key;renderModule();$("#backdrop").classList.add("open");if(key==="sharing")submit("sharing.status",{},null,true);if(key==="android")submit("adb.devices",{},null,true);if(key==="pc"||key==="clipboard")submit("peer.list",{},null,true)}
function setJob(job){
  activeJob=job?.id||"";
  const dock=$("#jobDock");
  if(!job){dock.classList.remove("show");return}
  dock.classList.add("show");$("#jobMessage").textContent=job.message||job.operation||"Working";$("#jobPct").textContent=Math.round(job.progress||0)+"%";$("#jobBar").style.width=(job.progress||0)+"%";$("#cancelJob").style.display=["queued","running"].includes(job.status)?"block":"none";
}
async function submit(operation,params={},context=null,quiet=false){
  try{
    const r=await window.ttg.backend.submit(operation,params);
    if(!r?.job)throw new Error(r?.message||"Engine did not return a job");
    r.job.context=context;
    jobs.set(r.job.id,{context,operation});
    setJob(r.job);
    if(!quiet)toast("Queued: "+operation);
    return r.job.id;
  }catch(e){toast(e.message||"Engine unavailable");return ""}
}
const jobs=new Map();
function handleFinished(job){
  const meta=jobs.get(job.id)||{};
  jobs.delete(job.id);
  setJob(job);
  const r=job.result||{};
  if(job.status==="completed")toast(r.message||job.message||"Completed");else if(job.status==="cancelled")toast("Cancelled");else toast(r.message||job.error||job.message||"Failed");
  if(job.operation==="sharing.status"||job.operation==="sharing.toggle"){data.sharing.status=r.status||r; if((r.status||r).connection)apply({connection:(r.status||r).connection});}
  if(job.operation==="adb.devices"){data.android.devices=r.devices||[];if(data.android.devices.length&&!data.android.serial)data.android.serial=data.android.devices[0].serial;}
  if(job.operation==="adb.apps"){data.android.apps=r.apps||[];if(data.android.apps.length&&!data.android.app)data.android.app=data.android.apps[0];}
  if(job.operation==="peer.list"){data.pc.peers=r.peers||[];data.clipboard.peers=r.peers||[];}
  if(job.operation==="ios.status"){data.iphone.devices=r.devices||[];}
  if($("#backdrop").classList.contains("open"))renderModule();
}
window.ttg.onBackendEvent(evt=>{
  if(!evt)return;
  const job=evt.job;
  if((evt.type==="job.progress"||evt.type==="job.queued")&&job){if(job.id===activeJob)setJob(job)}
  if(evt.type==="job.finished"&&job)handleFinished(job);
});

function wireControls(){
  const adbDevice=$("#adbDevice");if(adbDevice)adbDevice.onchange=e=>data.android.serial=e.target.value;
  const adbApp=$("#adbApp");if(adbApp)adbApp.onchange=e=>data.android.app=e.target.value;
  $$("[data-cmd]").forEach(b=>b.onclick=()=>command(b.dataset.cmd,b));
}
async function command(cmd,b){
  if(cmd==="engineSnapshot"){const r=await window.ttg.backend.invoke("app.snapshot",{});toast(r.message||"Engine ready");return}
  if(cmd==="sharingRefresh"){submit("sharing.status",{},null,true);return}
  if(cmd==="sharingToggle"){submit("sharing.toggle",{enable:state.connection!=="sending",public:$("#sharePublic")?.value||"Wi-Fi",private:$("#sharePrivate")?.value||"Ethernet"});return}
  if(cmd==="filesChoose"||cmd==="pcFiles"){const r=await window.ttg.dialog.openFiles({title:"Choose files",multi:true});if(!r.canceled){data[cmd==="pcFiles"?"pc":"files"].sources=r.paths;renderModule()}return}
  if(cmd==="filesChooseFolder"||cmd==="pcFolder"){const r=await window.ttg.dialog.openFolder({title:"Choose source folder"});if(!r.canceled){data[cmd==="pcFolder"?"pc":"files"].sources=[r.path];renderModule()}return}
  if(cmd==="filesDestination"||cmd==="pcDestination"){const r=await window.ttg.dialog.openFolder({title:"Choose destination"});if(!r.canceled){data[cmd==="pcDestination"?"pc":"files"].destination=r.path;renderModule()}return}
  if(cmd==="filesTransfer"||cmd==="pcTransfer"){const d=data[cmd==="pcTransfer"?"pc":"files"];submit("files.copy",{sources:d.sources,destination:d.destination});return}
  if(cmd==="peerRefresh"||cmd==="clipPeers"){submit("peer.list",{},null,true);return}
  if(cmd==="clipText"){const c=await window.ttg.clipboard.readText();submit("clipboard.text",{text:c.text,targets:data.clipboard.targets});return}
  if(cmd==="clipImage"){const c=await window.ttg.clipboard.readImage();submit("clipboard.image",{data_url:c.dataUrl,targets:data.clipboard.targets});return}
  if(cmd==="adbRefresh"){submit("adb.devices",{},null,true);return}
  if(cmd==="apkBrowse"){const r=await window.ttg.dialog.openFiles({title:"Choose APK",multi:false,filters:[{name:"Android APK",extensions:["apk","apks","xapk"]}]});if(!r.canceled){data.android.apk=r.paths[0]||"";renderModule()}return}
  if(cmd==="apkInstall"){submit("adb.install",{path:data.android.apk,serial:data.android.serial});return}
  if(cmd==="appsRefresh"){submit("adb.apps",{serial:data.android.serial});return}
  if(cmd==="appUninstall"){if(!data.android.app){toast("Choose an app");return}submit("adb.uninstall",{package:data.android.app,serial:data.android.serial});return}
  if(cmd==="iosStatus"){submit("ios.status",{});return}
  if(cmd==="ipaBrowse"){const r=await window.ttg.dialog.openFiles({title:"Choose IPA",multi:false,filters:[{name:"iPhone IPA",extensions:["ipa"]}]});if(!r.canceled){data.iphone.ipa=r.paths[0]||"";renderModule()}return}
  if(cmd==="ipaInstall"){submit("ios.ipa",{path:data.iphone.ipa});return}
  if(cmd==="consoleBrowse"){const key=b.dataset.console,ext=(b.dataset.ext||"").split(",").filter(Boolean);const r=await window.ttg.dialog.openFiles({title:"Choose package",multi:true,filters:[{name:"Packages",extensions:ext}]});if(!r.canceled){data[key].paths=r.paths;renderModule()}return}
  if(cmd==="consoleStatus"){submit("console.status",{console:b.dataset.console});return}
  if(cmd==="consoleInstall"){const key=b.dataset.console;submit("console.pkg",{console:key,paths:data[key].paths});return}
}

$$(".hotspot").forEach(b=>b.onclick=()=>openModule(b.dataset.module));
$("#minBtn").onclick=()=>window.ttg.windowControl("minimize");
$("#closeBtn").onclick=()=>window.ttg.windowControl("close");
$("#closeModal").onclick=()=>$("#backdrop").classList.remove("open");
$("#maxModal").onclick=()=>{const m=$("#modal");m.classList.toggle("max");$("#maxModal").textContent=m.classList.contains("max")?"❐":"▢"};
$("#cancelJob").onclick=()=>{if(activeJob)window.ttg.backend.cancel(activeJob)};
$("#backdrop").onclick=e=>{if(e.target.id==="backdrop")$("#backdrop").classList.remove("open")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#backdrop").classList.remove("open")});
(async()=>{try{const s=await window.ttg.stateGet();if(s)apply(s)}catch{};window.ttg.onState(apply);apply(state)})();
</script>
</body>
</html>
