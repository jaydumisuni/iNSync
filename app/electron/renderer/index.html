<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iNSync</title>
<style>
:root{--red:#ff5d7b;--blue:#59ccff;--green:#42f79d;--text:#eef9ff;--muted:#a9bfd6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--text);font-family:Segoe UI,Inter,Arial,sans-serif}
button,select,input{font:inherit}
#stage{position:fixed;inset:0;background:transparent;-webkit-app-region:drag}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.logo{position:absolute;left:42.2%;bottom:3.2%;width:15.6%;height:auto;z-index:8;pointer-events:none;filter:drop-shadow(0 0 14px rgba(75,166,255,.45))}
.hotspot,.window-btn,.modal,.modal *{-webkit-app-region:no-drag}
.hotspot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer;border-radius:30%;outline:none}
.hotspot::after{content:attr(data-label);position:absolute;left:50%;bottom:0;transform:translate(-50%,75%);opacity:0;pointer-events:none;white-space:nowrap;padding:5px 8px;border-radius:999px;background:rgba(10,18,34,.78);border:1px solid rgba(88,189,255,.18);backdrop-filter:blur(14px);color:#eaf8ff;font-size:10px;font-weight:700;transition:.14s}
.hotspot:hover{filter:drop-shadow(0 0 11px #34d8ff)}
.hotspot:hover::after{opacity:1;transform:translate(-50%,100%)}
.hs-wifi{left:37%;top:0;width:25%;height:18%}.hs-ps{left:18%;top:5%;width:29%;height:27%}.hs-xbox{left:57%;top:4%;width:29%;height:26%}.hs-switch{left:71%;top:22%;width:29%;height:22%}.hs-iphone{left:2%;top:23%;width:23%;height:24%}.hs-ipa{left:0;top:39%;width:19%;height:19%}.hs-android{left:78%;top:39%;width:22%;height:20%}.hs-folder{left:79%;top:54%;width:21%;height:20%}.hs-clipboard{left:82%;top:70%;width:18%;height:20%}.hs-pc{left:0;top:71%;width:30%;height:20%}.hs-home{left:25%;top:31%;width:50%;height:62%;border-radius:46%;z-index:3}
.window-btn{position:absolute;top:38.3%;z-index:12;width:36px;height:36px;border-radius:13px;border:1px solid rgba(104,184,255,.18);background:linear-gradient(180deg,rgba(16,26,48,.72),rgba(6,12,25,.58));backdrop-filter:blur(14px);color:#e9f8ff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.32);font-size:20px}
.window-btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(0,0,0,.36),0 0 15px rgba(79,185,255,.18)}
#minBtn{left:28.5%;padding-bottom:6px}#closeBtn{right:28.5%;color:#ffdbe4;border-color:rgba(255,92,124,.22);background:linear-gradient(180deg,rgba(56,14,29,.72),rgba(29,7,15,.58))}
/* standalone glass modal language */.backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);z-index:100;padding:18px}.backdrop.open{display:flex}.modal{width:min(880px,92vw);height:min(560px,76vh);overflow:hidden;border-radius:28px;background:linear-gradient(180deg,rgba(18,27,49,.55),rgba(5,10,22,.5));border:1px solid rgba(90,190,255,.22);box-shadow:0 24px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.03);padding:16px;backdrop-filter:blur(24px);display:grid;grid-template-rows:auto minmax(0,1fr)}.modal.maximized{width:min(1180px,96vw);height:min(860px,92vh);padding:18px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:12px;border-bottom:1px solid rgba(86,185,255,.12)}.modal-title{display:flex;align-items:center;gap:14px;min-width:0}.modal-title img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 0 15px rgba(49,183,255,.3))}.modal.maximized .modal-title img{width:76px;height:76px}.modal-title h2{margin:0;font-size:22px}.modal.maximized .modal-title h2{font-size:26px}.modal-title p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:1.45}.modal.maximized .modal-title p{font-size:13px}.modal-actions{display:flex;align-items:center;gap:8px}.modal-btn{width:40px;height:40px;border-radius:14px;border:1px solid rgba(80,180,255,.18);background:rgba(255,255,255,.04);color:white;font-size:21px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(12px)}.modal-btn:hover{box-shadow:0 0 18px rgba(88,187,255,.18);transform:translateY(-1px)}.modal-btn.max{font-size:17px}.modal-btn.close{color:#ffdbe4;border-color:rgba(255,100,140,.22);background:rgba(80,18,36,.28)}.modal-body{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;padding-top:12px;min-height:0;overflow:hidden;align-items:stretch}.modal.maximized .modal-body{grid-template-columns:1.25fr .75fr;gap:14px}.modal-body > *{min-height:0}.card{border:1px solid rgba(83,180,255,.13);background:linear-gradient(180deg,rgba(26,36,62,.42),rgba(9,14,28,.34));border-radius:20px;padding:12px;backdrop-filter:blur(18px);overflow:hidden}.card h3,.card h4{margin:0 0 8px}.card p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.modal.maximized .card p{font-size:12.5px;line-height:1.55}.rows{display:grid;gap:8px;margin-top:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:15px;background:rgba(255,255,255,.03);border:1px solid rgba(91,180,255,.09)}.row b{font-size:11.5px}.modal.maximized .row b{font-size:12.5px}.row small{display:block;color:var(--muted);margin-top:2px}.tag{padding:5px 8px;border-radius:999px;font-size:9.5px;border:1px solid rgba(80,190,255,.18);color:#d8f5ff;background:rgba(51,163,255,.08)}.tag.green{color:#baffd3;border-color:rgba(57,255,145,.25);background:rgba(57,255,145,.08)}.tag.red{color:#ffd3dc;border-color:rgba(255,62,105,.25);background:rgba(255,62,105,.08)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.action{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(86,177,255,.11);background:rgba(255,255,255,.03);border-radius:16px;backdrop-filter:blur(16px)}.action img{width:40px;height:40px;object-fit:contain}.modal.maximized .action img{width:48px;height:48px}.action b{display:block;font-size:11.5px}.modal.maximized .action b{font-size:12.5px}.action span{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;line-height:1.35}.modal.maximized .action span{font-size:11.5px}.control{margin-top:10px}.control label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#a5c4e1;margin-bottom:5px}.control select,.control input[type=text],.control input[type=file]{width:100%;padding:9px 10px;border-radius:12px;border:1px solid rgba(88,180,255,.15);background:rgba(8,14,28,.72);color:white}.primary,.secondary{border:0;border-radius:13px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(90deg,#23dfff,#5667ff);color:#00101b}.secondary{background:rgba(255,255,255,.06);color:#e7f7ff;border:1px solid rgba(92,180,255,.15)}.buttonbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.toggle{width:58px;height:30px;border-radius:999px;background:rgba(255,62,105,.3);border:1px solid rgba(255,62,105,.3);position:relative;cursor:pointer}.toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:white;transition:.18s}.toggle.on{background:rgba(57,255,145,.28);border-color:rgba(57,255,145,.32)}.toggle.on i{left:31px}.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#20e6ff,#4e67ff,#a751ff);border-radius:999px}.checklist{display:grid;gap:8px;margin-top:10px}.check{display:flex;align-items:center;gap:8px;color:#dff7ff;font-size:12px}.check input{accent-color:#33dfff}.app-list{display:grid;gap:8px;margin-top:10px}.app-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px;border-radius:15px;border:1px solid rgba(88,180,255,.1);background:rgba(255,255,255,.025)}.app-row b{font-size:12px}.app-row span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.danger{border:1px solid rgba(255,62,105,.25);background:rgba(255,62,105,.08);color:#ffd6df;border-radius:10px;padding:6px 8px;font-size:10px;cursor:pointer}.mini-explorer{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pane{min-height:180px;border-radius:16px;border:1px solid rgba(80,180,255,.12);background:rgba(0,0,0,.18);padding:10px}.pane h4{font-size:11px;color:#c8eaff;margin:0 0 8px}.file{padding:7px 8px;border-radius:10px;color:#cfe4f7;font-size:11px}.file:hover{background:rgba(45,159,255,.08)}

.module-art,.mini-art{flex:0 0 auto;background-image:url("assets/insync-ui-disconnected.png");background-repeat:no-repeat;background-size:500% auto;background-color:rgba(12,20,38,.35);border:1px solid rgba(82,183,255,.13);box-shadow:inset 0 0 18px rgba(41,151,255,.07)}
.module-art{width:58px;height:58px;border-radius:17px}.mini-art{width:42px;height:42px;border-radius:13px}
.icon-sharing{background-position:50% 2%}.icon-playstation{background-position:25% 10%}.icon-xbox{background-position:73% 10%}.icon-switch{background-position:92% 31%}.icon-iphone{background-position:5% 32%}.icon-ipa{background-position:2% 49%}.icon-android{background-position:97% 50%}.icon-apk{background-position:2% 66%}.icon-files{background-position:97% 66%}.icon-clipboard{background-position:98% 84%}.icon-pc{background-position:1% 86%}.icon-home{background-position:50% 52%}
.modal{grid-template-rows:auto minmax(0,1fr) auto}.modal-title .module-art{filter:drop-shadow(0 0 15px rgba(49,183,255,.3))}
.jobdock{display:none;align-items:center;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:8px 10px;border-radius:14px;border:1px solid rgba(89,190,255,.12);background:rgba(8,16,30,.62)}.jobdock.show{display:grid}.jobmeta{min-width:0}.jobline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;color:#d9edff}.jobline span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cancel{padding:6px 9px;border-radius:9px;border:1px solid rgba(255,93,123,.18);background:rgba(255,93,123,.08);color:#ffd7df;font-size:9px;cursor:pointer}
.tag.blue{color:#c9efff;border-color:rgba(89,204,255,.25);background:rgba(89,204,255,.08)}.empty-state{padding:14px;border-radius:14px;border:1px dashed rgba(88,180,255,.14);background:rgba(0,0,0,.12);color:#9db4d2;font-size:11px;text-align:center}.share-path{margin-top:9px;padding:8px 10px;border-radius:12px;border:1px dashed rgba(88,180,255,.16);background:rgba(0,0,0,.16);color:#cfe4f7;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted-file{color:#7f9ab7}.queue-card{padding:11px;border-radius:15px;border:1px solid rgba(88,180,255,.1);background:rgba(255,255,255,.025)}.queue-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.queue-head b{font-size:12px}.queue-head small{display:block;color:#9db4d2;margin-top:3px;font-size:10px}.queue-pct{text-align:right;margin-top:5px;font-size:9px;color:#a9c9e8}.pager{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:8px;font-size:9px;color:#a9c9e8}.pager button{padding:5px 8px}

#toast{position:fixed;left:50%;bottom:12px;z-index:80;transform:translate(-50%,16px);opacity:0;padding:7px 10px;border-radius:999px;background:rgba(9,17,31,.9);border:1px solid rgba(82,189,255,.2);color:#e9f8ff;font-size:9px;transition:.16s;-webkit-app-region:no-drag}#toast.show{opacity:1;transform:translate(-50%,0)}
.peer-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}.peer-btn{padding:5px 7px;font-size:9px;border-radius:9px}.sectiontabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}.sectiontab{border:1px solid rgba(88,180,255,.12);background:rgba(255,255,255,.035);color:#bcd5ec;border-radius:10px;padding:7px 5px;font-size:9px;font-weight:700;cursor:pointer}.sectiontab.active{color:#00101b;background:linear-gradient(90deg,#23dfff,#5667ff)}.media-list{display:grid;gap:7px}.media-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 9px;border-radius:13px;border:1px solid rgba(88,180,255,.1);background:rgba(255,255,255,.025)}.media-row b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-row span{display:block;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}.media-actions{display:flex;gap:5px}.mini{padding:5px 7px!important;font-size:9px!important;border-radius:9px!important}</style>
</head>
<body>
<div id="stage">
  <img id="art" src="assets/insync-ui-disconnected.png" alt="">
  <img class="logo" src="assets/insync-logo-transparent.png" alt="iNSync">
  <button id="minBtn" class="window-btn" aria-label="Minimize">&minus;</button>
  <button id="closeBtn" class="window-btn" aria-label="Close">&times;</button>
  <button class="hotspot hs-wifi" data-module="sharing" data-label="Sharing"></button>
  <button class="hotspot hs-ps" data-module="playstation" data-label="PlayStation"></button>
  <button class="hotspot hs-xbox" data-module="xbox" data-label="Xbox"></button>
  <button class="hotspot hs-switch" data-module="switch" data-label="Switch"></button>
  <button class="hotspot hs-iphone" data-module="iphone" data-label="iPhone"></button>
  <button class="hotspot hs-ipa" data-module="ipa" data-label="IPA"></button>
  <button class="hotspot hs-android" data-module="android" data-label="Android"></button>
  <button class="hotspot hs-folder" data-module="files" data-label="File Share"></button>
  <button class="hotspot hs-clipboard" data-module="clipboard" data-label="Clipboard"></button>
  <button class="hotspot hs-pc" data-module="pc" data-label="PC Share"></button>
  <button class="hotspot hs-home" data-module="home" data-label="Home"></button>
</div>

<div id="backdrop" class="backdrop">
  <section id="modal" class="modal">
    <header class="modal-head">
      <div id="modalTitle" class="modal-title"></div>
      <div class="modal-actions"><button id="maxModal" aria-label="Maximize">Max</button><button id="closeModal" class="x" aria-label="Close">&times;</button></div>
    </header>
    <div id="modalBody" class="modal-body"></div>
    <div id="jobDock" class="jobdock">
      <div class="jobmeta"><div class="jobline"><span id="jobMessage">Ready</span><span id="jobPct">0%</span></div><div class="progress"><i id="jobBar"></i></div></div>
      <button id="cancelJob" class="cancel">Cancel</button>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let state={connection:"disconnected",mode:"connection",clipboardEnabled:true};
let currentModule="home";
let activeJob="";
let engineSnapshot=null;
const jobs=new Map();
const recentJobs=[];
const artByState={disconnected:"assets/insync-ui-disconnected.png",receiving:"assets/insync-ui-receiving.png",sending:"assets/insync-ui-sending.png"};
const data={
  sharing:{status:null},
  pc:{peers:[],role:"idle",scope:"internet-only",sharedPaths:[],sources:[],destination:""},
  files:{sources:[],destination:""},
  clipboard:{peers:[],targets:[],types:{text:true,image:true,files:false},direction:"two-way"},
  android:{devices:[],serial:"",packagePaths:[],apps:[],page:0,info:null},
  ipa:{path:"",validation:null,status:null},
  iphone:{status:null,section:"photos",media:{photos:[],music:[]},apps:[],documents:[],bundleId:"",page:0},
  playstation:{paths:[],status:null},
  xbox:{paths:[],status:null},
  switch:{paths:[],status:null}
};

const modules={
  home:{
    title:"iNSync",sub:"Share - Transfer - Install - Sync. One transport core, multiple devices.",icon:"home",
    render(){
      const c=engineSnapshot?.capabilities||{};
      return [
        '<div class="card"><h3>Transport core</h3><p>Long-running work is queued in the iNSync engine, not the renderer.</p><div class="rows">'+row("Engine","Queued worker execution",engineSnapshot?.engine?.workers?engineSnapshot.engine.workers+" workers":"Ready","green")+row("File transport","Local, mapped and UNC copy with progress/cancel",c.file_copy?"Ready":"Unavailable",c.file_copy?"green":"red")+row("Android","ADB package and app operations",c.adb?"Ready":"ADB missing",c.adb?"green":"red")+row("iPhone","Photos, apps and Documents through the Apple device bridge",c.ios_bridge?"Ready":"Bridge missing",c.ios_bridge?"green":"red")+row("Clipboard peers","Approved peer text/image transport",c.clipboard_peer?"Ready":"Unavailable",c.clipboard_peer?"green":"red")+'</div><div class="buttonbar"><button class="secondary" data-cmd="engineRefresh">Refresh engine</button></div></div>',
        '<div class="card"><h3>Connection law</h3><div class="rows">'+row("Green","Provider / sending","Active","green")+row("Blue","Receiver / receiving","Active","blue")+row("Red","Disconnected / inactive","Off","red")+'</div><p style="margin-top:10px">Every popup is one view into the same engine. Device-specific adapters stay capability-gated when a backend is unavailable.</p></div>'
      ];
    }
  },
  sharing:{
    title:"Sharing",sub:"Flip this PC between Internet sharing and normal networking.",icon:"sharing",
    render(){
      const x=data.sharing.status||{},on=state.connection==="sending";
      return [
        '<div class="card"><h3>Internet sharing</h3><div class="row"><div><b>Current mode</b><small>'+esc(x.message||(on?"Sharing Internet":"Normal networking"))+'</small></div><div class="toggle '+(on?"on":"")+'" data-cmd="sharingToggle"><i></i></div></div><div class="grid2" style="margin-top:10px"><div class="control"><label>Internet source</label><select id="sharePublic"><option>Wi-Fi</option><option>Ethernet</option></select></div><div class="control"><label>Share to</label><select id="sharePrivate"><option>Ethernet</option><option>Wi-Fi</option></select></div></div><div class="rows">'+row("Private gateway",x.ethernetIPv4||"Ethernet",x.ethernetStatus||"Unknown",x.ethernetStatus==="Up"?"green":"")+row("Uplink",x.wifiIPv4||"Wi-Fi",x.wifiGateway?"Gateway "+x.wifiGateway:"Auto","")+'</div><div class="buttonbar"><button class="primary" data-cmd="sharingToggle">'+(on?"Back to normal":"Start sharing")+'</button><button class="secondary" data-cmd="sharingRefresh">Verify state</button></div></div>',
        '<div class="card"><h3>Connection law</h3><div class="rows">'+row("Green","This PC is sending/providing","Provider","green")+row("Blue","This PC is receiving","Receiver","blue")+row("Red","No active sharing role","Off","red")+'</div><p style="margin-top:10px">The network mutation stays in the engine and Windows elevation path. The popup only chooses and displays state.</p></div>'
      ];
    }
  },
  pc:{
    title:"PC Share",sub:"Choose provider / receiver roles, share Internet, folders, locations or the whole PC.",icon:"pc",
    render(){
      const me=localPeer();
      if(me){data.pc.role=me.role||data.pc.role;data.pc.scope=me.scope||data.pc.scope;data.pc.sharedPaths=me.shared_paths||data.pc.sharedPaths}
      const peerRows=data.pc.peers.length?data.pc.peers.slice(0,6).map(peer=>peerRowHtml(peer)).join(''):'<div class="empty-state">No iNSync peers found yet.</div>';
      return [
        '<div class="card"><h3>PCs on the network</h3><div class="rows">'+peerRows+'</div><div class="grid2" style="margin-top:10px"><div class="control"><label>This PC role</label><select id="pcRole"><option value="provider" '+(data.pc.role==="provider"?"selected":"")+'>Provider</option><option value="receiver" '+(data.pc.role==="receiver"?"selected":"")+'>Receiver</option><option value="idle" '+(data.pc.role==="idle"?"selected":"")+'>Idle</option></select></div><div class="control"><label>Share scope</label><select id="pcScope"><option value="internet-only" '+(data.pc.scope==="internet-only"?"selected":"")+'>Internet only</option><option value="internet-folders" '+(data.pc.scope==="internet-folders"?"selected":"")+'>Internet + selected folders</option><option value="selected-location" '+(data.pc.scope==="selected-location"?"selected":"")+'>Selected folder/location</option><option value="whole-pc" '+(data.pc.scope==="whole-pc"?"selected":"")+'>Whole PC (explicit)</option></select></div></div><div class="share-path">'+esc(data.pc.sharedPaths.join(" · ")||"No shared folder selected")+'</div><div class="buttonbar"><button class="secondary" data-cmd="pcChooseFolder">Choose location</button><button class="primary" data-cmd="pcApply">Apply</button><button class="secondary" data-cmd="peerRefresh">Refresh peers</button></div></div>',
        '<div class="card"><h3>Color law</h3><div class="rows">'+row("Green","Providing Internet / data","Provider","green")+row("Blue","Receiving Internet / data","Receiver","blue")+row("Red","Inactive / not sharing","Off","red")+'</div><h3 style="margin-top:14px">Trust</h3><p>Discovery is automatic. Only approved iNSync endpoints become eligible for transfer and clipboard actions.</p></div>'
      ];
    }
  },
  files:{
    title:"File Share",sub:"Explorer-style send / receive popup for PCs and supported destinations.",icon:"files",
    render(){
      const q=queueJobFor("files");
      return [
        '<div class="card"><h3>File explorer</h3><div class="mini-explorer"><div class="pane"><h4>PC source</h4>'+selectedPaths(data.files.sources,"Choose files or a folder")+'</div><div class="pane"><h4>Destination</h4><div class="file">'+esc(data.files.destination||"Choose destination folder")+'</div></div></div><div class="buttonbar"><button class="secondary" data-cmd="filesChoose">Choose files</button><button class="secondary" data-cmd="filesChooseFolder">Choose folder</button><button class="secondary" data-cmd="filesDestination">Destination</button><button class="primary" data-cmd="filesTransfer">Send selected</button></div></div>',
        '<div class="card"><h3>Transfer queue</h3>'+(q?jobCard(q):'<div class="empty-state">No transfer queued.</div>')+'<div class="rows" style="margin-top:10px">'+row("Storage guard","Destination must be selected before transfer","On","green")+row("Transport","Local / mapped drive / UNC path","Ready","green")+'</div></div>'
      ];
    }
  },
  clipboard:{
    title:"Clipboard",sub:"Selective text/image sync with approved iNSync peers.",icon:"clipboard",
    render(){
      const targets=new Set(data.clipboard.targets);
      const peers=data.clipboard.peers.filter(x=>!x.self).slice(0,6);

function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtBytes(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return "Unknown";let v=Number(n),u="B";for(const next of ["KB","MB","GB","TB"]){if(v<1024)break;v/=1024;u=next}return (v>=100?Math.round(v):v>=10?v.toFixed(1):v.toFixed(2))+" "+u}
function toast(t){const n=$("#toast");n.textContent=t||"Done";n.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>n.classList.remove("show"),1600)}
function apply(v){state={...state,...v};$("#art").src=artByState[state.connection]||artByState.disconnected}

function peerTag(peer){const role=(peer.role||"idle").toLowerCase();if(role==="provider")return tag("Provider","green");if(role==="receiver")return tag("Receiver","blue");return tag(peer.approved===false?"Unapproved":"Idle","red")}

function jobCard(job){const pct=Math.round(job.progress||0);return '<div class="queue-card"><div class="queue-head"><div><b>'+esc(job.operation||"Job")+'</b><small>'+esc(job.message||job.status||"")+'</small></div>'+tag(job.status||"queued",job.status==="completed"?"green":job.status==="failed"?"red":"")+'</div><div class="progress"><i style="width:'+pct+'%"></i></div><div class="queue-pct">'+pct+'%</div></div>'}

function renderModule(){
  const m=modules[currentModule]||modules.home;
  $("#modalTitle").innerHTML=moduleIcon(m.icon||currentModule)+'<div><h2>'+esc(m.title)+'</h2><p>'+esc(m.sub)+'</p></div>';
  $("#modalBody").innerHTML=m.render().join("");
  wireControls();
}
function openModule(key){
  currentModule=key;renderModule();$("#backdrop").classList.add("open");
  if(key==="home")refreshEngine();
  if(key==="sharing")submit("sharing.status",{},"sharing",true);
  if(key==="android")submit("adb.devices",{},"android",true);
  if(key==="pc"||key==="clipboard")submit("peer.list",{},key,true);
  if(key==="iphone"){submit("ios.status",{},"iphone",true);submit("ios.apps",{},"iphone",true);submit("ios.media.list",{kind:"photos"},"iphone",true)}
  if(key==="ipa")submit("ios.status",{},"ipa",true);
  if(["playstation","xbox","switch"].includes(key))submit("console.status",{console:key},key,true);
}
function setJob(job){
  activeJob=job?.id||"";
  const dock=$("#jobDock");if(!job){dock.classList.remove("show");return}
  dock.classList.add("show");$("#jobMessage").textContent=job.message||job.operation||"Working";$("#jobPct").textContent=Math.round(job.progress||0)+"%";$("#jobBar").style.width=(job.progress||0)+"%";$("#cancelJob").style.display=["queued","running"].includes(job.status)?"block":"none";
}
function rememberJob(job,context,operation){
  const meta={job:{...job},context,operation};jobs.set(job.id,meta);recentJobs.unshift(meta);if(recentJobs.length>30)recentJobs.length=30;
}
function updateRemembered(job){
  const meta=jobs.get(job.id);if(meta){meta.job={...job};const r=recentJobs.find(x=>x.job.id===job.id);if(r)r.job={...job}}
}
async function submit(operation,params={},context=null,quiet=false){
  try{
    const r=await window.ttg.backend.submit(operation,params);
    if(!r?.job)throw new Error(r?.message||"Engine did not return a job");
    rememberJob(r.job,context,operation);setJob(r.job);if(!quiet)toast("Queued: "+operation);return r.job.id;
  }catch(e){toast(e.message||"Engine unavailable");return ""}
}
async function refreshEngine(){
  try{engineSnapshot=await window.ttg.backend.invoke("app.snapshot",{});if(currentModule==="home")renderModule()}catch(e){toast(e.message||"Engine unavailable")}
}
function handleFinished(job){
  updateRemembered(job);const meta=jobs.get(job.id)||{},r=job.result||{};if(job.id===activeJob)setJob(job);
  if(job.status==="completed")toast(r.message||job.message||"Completed");else if(job.status==="cancelled")toast("Cancelled");else toast(r.message||job.error||job.message||"Failed");
  if(job.operation==="sharing.status"||job.operation==="sharing.toggle"){data.sharing.status=r.status||r;const x=r.status||r;if(x.connection)apply({connection:x.connection})}
  if(job.operation==="peer.list"){data.pc.peers=r.peers||[];data.clipboard.peers=r.peers||[]}
  if(job.operation==="peer.approve")submit("peer.list",{},currentModule,true);
  if(job.operation==="peer.configure"&&r.peer){data.pc.role=r.peer.role||data.pc.role;data.pc.scope=r.peer.scope||data.pc.scope;data.pc.sharedPaths=r.peer.shared_paths||data.pc.sharedPaths;const c=roleColor(data.pc.role);apply({connection:c});window.ttg.stateSet({connection:c});submit("peer.list",{},null,true)}
  if(job.operation==="adb.devices"){data.android.devices=r.devices||[];if(data.android.devices.length&&!data.android.serial)data.android.serial=data.android.devices[0].serial;if(data.android.serial)submit("adb.info",{serial:data.android.serial},"android",true)}
  if(job.operation==="adb.info")data.android.info=r;
  if(job.operation==="adb.apps"){data.android.apps=r.apps||[];data.android.page=0}
  if(job.operation==="adb.uninstall"||job.operation==="adb.disable")submit("adb.apps",{serial:data.android.serial},"android",true);
  if(job.operation==="ios.status"){if(meta.context==="ipa")data.ipa.status=r;else data.iphone.status=r}
  if(job.operation==="ios.validate"){data.ipa.validation=r;if(r.ok&&meta.context==="validate-install")submit("ios.ipa",{path:data.ipa.path},"ipa",false)}
  if(job.operation==="ios.apps")data.iphone.apps=r.apps||[];
  if(job.operation==="ios.media.list"&&r.kind)data.iphone.media[r.kind]=r.items||[];
  if(job.operation==="ios.documents.list"){data.iphone.documents=r.items||[];if(r.bundle_id)data.iphone.bundleId=r.bundle_id}
  if(job.operation==="ios.app.uninstall")submit("ios.apps",{},"iphone",true);
  if(job.operation==="ios.media.delete"&&r.kind)submit("ios.media.list",{kind:r.kind},"iphone",true);
  if(job.operation==="ios.documents.delete")submit("ios.documents.list",{bundle_id:data.iphone.bundleId},"iphone",true);
  if(job.operation==="console.status"&&meta.context&&data[meta.context])data[meta.context].status=r;
  if(job.operation==="console.pkg"&&meta.context&&data[meta.context])data[meta.context].status=r;
  if($("#backdrop").classList.contains("open"))renderModule();
}
window.ttg.onBackendEvent(evt=>{
  if(!evt)return;const job=evt.job;
  if((evt.type==="job.progress"||evt.type==="job.queued")&&job){updateRemembered(job);if(job.id===activeJob)setJob(job);if($("#backdrop").classList.contains("open"))renderModule()}
  if(evt.type==="job.finished"&&job)handleFinished(job);
  if(evt.type==="sharing.state"&&evt.connection)apply({connection:evt.connection});
  if(evt.type==="peer.clipboard")toast("Clipboard received from "+(evt.sender_name||evt.sender_ip||"peer"));
});

function wireControls(){

  const docApp=$("#iphoneDocApp");if(docApp)docApp.onchange=e=>{data.iphone.bundleId=e.target.value;data.iphone.documents=[];if(data.iphone.bundleId)submit("ios.documents.list",{bundle_id:data.iphone.bundleId},"iphone",true)};
  $$("[data-cmd]").forEach(x=>x.onclick=()=>command(x.dataset.cmd,x));
}
function syncClipboardControls(){
  data.clipboard.types.text=!!$("#clipTypeText")?.checked;data.clipboard.types.image=!!$("#clipTypeImage")?.checked;data.clipboard.types.files=!!$("#clipTypeFiles")?.checked;
  data.clipboard.direction=$("#clipDirection")?.value||"two-way";data.clipboard.targets=$$("[data-peer-id]:checked").map(x=>x.dataset.peerId);

async function command(cmd,b){
  if(cmd==="engineSnapshot"||cmd==="engineRefresh"){await refreshEngine();return}
  if(cmd==="sharingRefresh"){submit("sharing.status",{},"sharing",true);return}
  if(cmd==="sharingToggle"){submit("sharing.toggle",{enable:state.connection!=="sending",public:$("#sharePublic")?.value||"Wi-Fi",private:$("#sharePrivate")?.value||"Ethernet"},"sharing");return}
  if(cmd==="peerRefresh"||cmd==="clipPeers"){submit("peer.list",{},currentModule,true);return}
  if(cmd==="peerApprove"){submit("peer.approve",{peer_id:b.dataset.peerId,approved:b.dataset.approved==="true"},currentModule);return}
  if(cmd==="pcChooseFolder"){const r=await window.ttg.dialog.openFolder({title:"Choose iNSync shared location"});if(!r.canceled){data.pc.sharedPaths=[r.path];renderModule()}return}
  if(cmd==="pcApply"){
    data.pc.role=$("#pcRole")?.value||"idle";data.pc.scope=$("#pcScope")?.value||"internet-only";
    if(["internet-folders","selected-location"].includes(data.pc.scope)&&!data.pc.sharedPaths.length){const r=await window.ttg.dialog.openFolder({title:"Choose shared location"});if(r.canceled)return;data.pc.sharedPaths=[r.path]}
    if(data.pc.scope==="whole-pc"&&!confirm("Whole PC sharing is explicit. Continue with this scope?"))return;
    submit("peer.configure",{role:data.pc.role,scope:data.pc.scope,shared_paths:data.pc.sharedPaths},"pc");return;
  }
  if(cmd==="filesChoose"){const r=await window.ttg.dialog.openFiles({title:"Choose files",multi:true});if(!r.canceled){data.files.sources=r.paths;renderModule()}return}
  if(cmd==="filesChooseFolder"){const r=await window.ttg.dialog.openFolder({title:"Choose source folder"});if(!r.canceled){data.files.sources=[r.path];renderModule()}return}
  if(cmd==="filesDestination"){const r=await window.ttg.dialog.openFolder({title:"Choose transfer destination"});if(!r.canceled){data.files.destination=r.path;renderModule()}return}
  if(cmd==="filesTransfer"){submit("files.copy",{sources:data.files.sources,destination:data.files.destination},"files");return}
  if(cmd==="clipboardToggle"){state.clipboardEnabled=!state.clipboardEnabled;await window.ttg.stateSet({clipboardEnabled:state.clipboardEnabled});renderModule();return}
  if(cmd==="clipboardApply"){syncClipboardControls();await window.ttg.stateSet({mode:"clipboard",clipboardEnabled:state.clipboardEnabled});toast("Clipboard selection applied");renderModule();return}
  if(cmd==="clipText"){syncClipboardControls();const c=await window.ttg.clipboard.readText();submit("clipboard.text",{text:c.text,targets:data.clipboard.targets,direction:data.clipboard.direction},"clipboard");return}
  if(cmd==="clipImage"){syncClipboardControls();const c=await window.ttg.clipboard.readImage();submit("clipboard.image",{data_url:c.dataUrl,targets:data.clipboard.targets,direction:data.clipboard.direction},"clipboard");return}
  if(cmd==="adbRefresh"){submit("adb.devices",{},"android",true);return}
  if(cmd==="apkBrowse"){const r=await window.ttg.dialog.openFiles({title:"Choose Android package",multi:true,filters:[{name:"Android packages",extensions:["apk","apks","xapk"]}]});if(!r.canceled){data.android.packagePaths=r.paths;renderModule()}return}
  if(cmd==="apkInstall"){submit("adb.install",{paths:data.android.packagePaths,serial:data.android.serial},"android");return}
  if(cmd==="appsRefresh"){submit("adb.apps",{serial:data.android.serial},"android");return}
  if(cmd==="appsPrev"){data.android.page=Math.max(0,data.android.page-1);renderModule();return}
  if(cmd==="appsNext"){data.android.page++;renderModule();return}
  if(cmd==="appUninstall"||cmd==="appDisable"){const pkg=b.dataset.package||"";const action=cmd==="appDisable"?"disable this system app for user 0":"uninstall this user app";if(!pkg||!confirm("Confirm: "+action+"?\\n\\n"+pkg))return;submit(cmd==="appDisable"?"adb.disable":"adb.uninstall",{package:pkg,serial:data.android.serial},"android");return}
  if(cmd==="ipaBrowse"){const r=await window.ttg.dialog.openFiles({title:"Choose IPA",multi:false,filters:[{name:"iPhone IPA",extensions:["ipa"]}]});if(!r.canceled){data.ipa.path=r.paths[0]||"";data.ipa.validation=null;renderModule()}return}
  if(cmd==="ipaValidateInstall"){if(!data.ipa.path){toast("Choose an IPA first");return}submit("ios.validate",{path:data.ipa.path},"validate-install");return}
  if(cmd==="ipaStatus"){submit("ios.status",{},"ipa",true);return}
  if(cmd==="iosStatus"){submit("ios.status",{},"iphone",true);return}
  if(cmd==="iphoneSection"){data.iphone.section=b.dataset.section||"photos";renderModule();if(data.iphone.section==="apps")submit("ios.apps",{},"iphone",true);else if(data.iphone.section==="documents"){if(data.iphone.bundleId)submit("ios.documents.list",{bundle_id:data.iphone.bundleId},"iphone",true)}else submit("ios.media.list",{kind:data.iphone.section},"iphone",true);return}
  if(cmd==="iphoneAppsRefresh"){submit("ios.apps",{},"iphone",true);return}
  if(cmd==="iphoneAppDelete"){const bundle=b.dataset.bundle||"";if(bundle&&confirm("Delete this app from the iPhone?\n\n"+bundle))submit("ios.app.uninstall",{bundle_id:bundle},"iphone");return}
  if(cmd==="iphoneDocuments"){data.iphone.bundleId=b.dataset.bundle||"";data.iphone.section="documents";renderModule();if(data.iphone.bundleId)submit("ios.documents.list",{bundle_id:data.iphone.bundleId},"iphone",true);return}
  if(cmd==="iphoneDocsRefresh"){if(!data.iphone.bundleId){toast("Choose an app first");return}submit("ios.documents.list",{bundle_id:data.iphone.bundleId},"iphone",true);return}
  if(cmd==="iphoneDocSend"){if(!data.iphone.bundleId){toast("Choose an app first");return}const r=await window.ttg.dialog.openFiles({title:"Send file to app Documents",multi:false});if(!r.canceled)submit("ios.documents.push",{bundle_id:data.iphone.bundleId,local_path:r.paths[0]},"iphone");return}
  if(cmd==="iphoneMediaRefresh"){submit("ios.media.list",{kind:b.dataset.kind||data.iphone.section},"iphone",true);return}
  if(cmd==="iphoneFileSave"){const dest=await window.ttg.dialog.openFolder({title:"Save iPhone file to PC"});if(dest.canceled)return;const kind=b.dataset.kind||data.iphone.section,path=b.dataset.path||"",bundle=b.dataset.bundle||data.iphone.bundleId;if(kind==="documents")submit("ios.documents.pull",{bundle_id:bundle,remote_path:path,destination:dest.path},"iphone");else submit("ios.media.pull",{kind,remote_path:path,destination:dest.path},"iphone");return}
  if(cmd==="iphoneFileDelete"){const kind=b.dataset.kind||data.iphone.section,path=b.dataset.path||"",bundle=b.dataset.bundle||data.iphone.bundleId;if(!path||!confirm("Delete this item from the iPhone?\n\n"+path))return;if(kind==="documents")submit("ios.documents.delete",{bundle_id:bundle,remote_path:path},"iphone");else submit("ios.media.delete",{kind,remote_path:path},"iphone");return}
  if(cmd==="consoleBrowse"){const key=b.dataset.console,ext=(b.dataset.ext||"").split(",").filter(Boolean);const r=await window.ttg.dialog.openFiles({title:"Choose package/content",multi:true,filters:[{name:"Packages",extensions:ext}]});if(!r.canceled){data[key].paths=r.paths;renderModule()}return}
  if(cmd==="consoleStatus"){submit("console.status",{console:b.dataset.console},b.dataset.console,true);return}
  if(cmd==="consoleInstall"){const key=b.dataset.console;submit("console.pkg",{console:key,paths:data[key].paths},key);return}
}

$$(".hotspot").forEach(b=>b.onclick=()=>openModule(b.dataset.module));
$("#minBtn").onclick=()=>window.ttg.windowControl("minimize");
$("#closeBtn").onclick=()=>window.ttg.windowControl("close");
$("#closeModal").onclick=()=>$("#backdrop").classList.remove("open");
$("#maxModal").onclick=()=>{const m=$("#modal");m.classList.toggle("maximized");$("#maxModal").textContent=m.classList.contains("maximized")?"Restore":"Max"};
$("#cancelJob").onclick=()=>{if(activeJob)window.ttg.backend.cancel(activeJob)};
$("#backdrop").onclick=e=>{if(e.target.id==="backdrop")$("#backdrop").classList.remove("open")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#backdrop").classList.remove("open")});
(async()=>{try{const s=await window.ttg.stateGet();if(s)apply(s)}catch{};window.ttg.onState(apply);apply(state)})();
</script>
</body>
</html>
